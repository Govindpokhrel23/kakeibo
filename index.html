<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>家計簿</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#A487B4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* 見た目：紫のヘッダー＋薄いグレーの背景＋白い行＋浮いたタブバー（ライトのみ） */
:root{
  --purple:#A487B4; --purple-d:#8E6FA0; --purple-soft:#E9E1EF;
  --bg:#F1F0F0; --row:#FBFAFA; --line:#E2E0E0; --ink:#333; --sub:#9A9A9A;
  --red:#D2453B; --blue:#3E7BD6; --sun:#D8483E; --sat:#5B6FD8;
  --f:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font-family:var(--f);color:inherit;cursor:pointer}
input,select{font-family:var(--f)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* ヘッダー */
.hdr{position:sticky;top:0;z-index:5;background:var(--purple);color:#fff;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:calc(env(safe-area-inset-top,0px) + 64px);display:flex;align-items:center;justify-content:center}
.hdr h1{margin:0;font-size:20px;font-weight:500;letter-spacing:.06em}
.seg{display:flex;background:#fff;border-radius:999px;padding:5px;gap:4px;width:min(100%,330px)}
.seg.wide{width:100%;max-width:440px}
.seg button{flex:1;border:none;background:none;border-radius:999px;padding:9px 4px;font-size:16px;color:#A0A0A0;white-space:nowrap}
.seg button.on{background:#ECEAEE;color:var(--purple-d);font-weight:700}
.monthnav{display:flex;align-items:center;justify-content:center;gap:22px;font-size:24px;width:100%;position:relative}
.monthnav button{background:none;border:none;color:inherit;font-size:22px;padding:4px 8px}
.monthnav .title{font-weight:300;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.searchbtn{position:absolute;right:0;width:48px;height:48px;border-radius:50%;border:none;background:var(--purple-soft);color:#333;display:flex;align-items:center;justify-content:center}
.searchbtn svg{width:24px;height:24px}

main{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 行グループ */
.group{background:var(--row);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:24px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));position:relative;background:none;border:none;width:100%;text-align:left;font-size:17px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1px solid var(--line)}
.row .val{color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.row input{border:none;background:none;font-size:17px;color:var(--ink);text-align:right;min-width:0;flex:1;padding:16px 0}
.row input::placeholder{color:#BDBDBD}
.row input.left{text-align:left}
.chev{color:#BDBDBD;font-size:20px;line-height:1;margin-left:6px}
.datewrap{position:relative;color:var(--sub);font-size:17px}
.datewrap input{position:absolute;inset:0;opacity:0;width:100%;padding:0}
.save{display:block;margin:36px auto 0;width:min(76%,340px);background:var(--purple);color:#fff;border:none;border-radius:999px;padding:16px;font-size:18px;font-weight:600;box-shadow:0 4px 10px rgba(120,90,140,.25)}

/* スキャンカード */
.scancard{margin:20px auto 0;width:calc(100% - 32px);max-width:520px;display:flex;align-items:center;gap:16px;background:#fff;border:none;border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:left}
.scancard .ic{width:56px;height:56px;border-radius:16px;background:var(--purple);display:flex;align-items:center;justify-content:center;flex:none}
.scancard .ic svg{width:30px;height:30px;color:#fff}
.scancard b{display:block;font-size:18px;color:var(--ink)}
.scancard span{font-size:13px;color:var(--sub)}
.subacts{display:flex;justify-content:center;gap:20px;margin-top:10px}
.subacts button{background:none;border:none;color:var(--purple-d);font-size:14px;padding:6px}
.seclabel{font-size:13px;color:var(--sub);margin:22px 0 -16px;padding-left:max(16px,env(safe-area-inset-left,0px))}

/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:#fff}
.cal .wk{text-align:center;font-size:14px;padding:4px 0;background:#F6F5F5;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cal .wk:nth-child(7n){border-right:none}
.cal .wk.sun,.cal .d.sun .n{color:var(--sun)}
.cal .wk.sat,.cal .d.sat .n{color:var(--sat)}
.cal .d{height:80px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 4px 6px;display:flex;flex-direction:column;justify-content:space-between;background:#fff;border-top:none;border-left:none;text-align:left;min-width:0}
.cal .d:nth-child(7n){border-right:none}
.cal .d.out{background:#F4F3F3}
.cal .d.out .n{color:#C4C4C4!important}
.cal .n{font-size:14px;align-self:flex-start;padding:0 3px;border-radius:3px;font-variant-numeric:tabular-nums}
.cal .d.today .n{background:var(--purple);color:#fff!important}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--purple)}
.cal .amt{font-size:12px;text-align:right;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:clip}
.cal .amt.in{color:var(--blue)}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--row);border-bottom:1px solid var(--line);padding:10px 0 12px}
.sum3 div{text-align:center}
.sum3 small{display:block;font-size:14px;color:var(--sub)}
.sum3 b{font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.dayhead{background:#ECEBEB;color:#555;font-size:15px;padding:6px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.list{background:var(--row)}
.item{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;text-align:left;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));position:relative;font-size:18px}
.item+.item::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1px solid var(--line)}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--sub);font-size:16px}
.item .a{font-variant-numeric:tabular-nums;white-space:nowrap}
.item .a.in{color:var(--blue)}
.item .scanmark{width:16px;height:16px;color:var(--purple);flex:none}
.empty{color:var(--sub);text-align:center;padding:36px 16px;font-size:15px;line-height:1.7}

/* グラフ */
.gnav{display:flex;align-items:center;justify-content:center;gap:26px;font-size:24px;padding:16px 0 10px;border-bottom:1px solid var(--line);margin:0 16px}
.gnav button{background:none;border:none;font-size:22px;color:#444;padding:4px 8px}
.gnav span{font-weight:300;font-variant-numeric:tabular-nums}
.donut{display:flex;justify-content:center;padding:16px 0 18px;border-bottom:1px solid var(--line)}
.donut svg{width:min(78vw,320px);height:auto}
.donut text{font-family:var(--f);fill:#fff;font-size:15px;paint-order:stroke;stroke:rgba(0,0,0,.12);stroke-width:2px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}

/* 設定 */
.setgroup{background:var(--row);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.setlabel{font-size:14px;color:var(--sub);padding:14px max(16px,env(safe-area-inset-left,0px)) 8px;background:#ECEBEB}
.row.danger{color:var(--red)}

/* タブバー */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;width:min(calc(100% - 32px),520px);background:rgba(255,255,255,.96);border-radius:40px;box-shadow:0 4px 18px rgba(0,0,0,.14);display:flex;padding:6px}
.tabbar button{flex:1;border:none;background:none;border-radius:32px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#444}
.tabbar svg{width:30px;height:30px;color:#555}
.tabbar button.on{background:#EDEBEE;color:var(--purple-d)}
.tabbar button.on svg{color:var(--purple)}

/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--purple);color:#fff;position:sticky;top:0;z-index:1}
.sheet .sh button{background:none;border:none;color:#fff;font-size:16px;padding:4px}
.sheet .sh b{font-weight:500;font-size:17px}
.sheet .group{margin-top:16px}
.sheet select{border:none;background:none;font-size:17px;color:var(--sub);text-align:right;direction:rtl;max-width:60%}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.catgrid button{background:#fff;border:2px solid transparent;border-radius:12px;padding:14px 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.catgrid button.on{border-color:var(--purple)}
.miniitems{padding:6px 16px 0;font-size:14px;color:#666}
.miniitems div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.btnrow{display:flex;gap:10px;padding:20px 16px 0}
.btnrow button{flex:1;border-radius:999px;padding:14px;font-size:16px;border:none}
.btn-p{background:var(--purple);color:#fff;font-weight:600}
.btn-d{background:#fff;color:var(--red);border:1px solid #E7C7C4!important}
.btn-g{background:#fff;color:#555;border:1px solid var(--line)!important}
details{padding:10px 16px;font-size:12px;color:var(--sub)}
details pre{white-space:pre-wrap;font-size:11px;background:#fff;padding:8px;border-radius:6px;max-height:180px;overflow:auto}
.note{font-size:13px;color:#666;line-height:1.7;padding:16px}

/* トースト */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;background:rgba(50,40,60,.92);color:#fff;border-radius:999px;padding:10px 18px;font-size:15px;max-width:calc(100% - 32px);text-align:center}

/* スキャナー */
.scanner{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scan-top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;gap:12px}
.scan-top button{background:var(--purple);color:#fff;border:none;border-radius:999px;padding:9px 20px;font-size:16px;font-weight:600}
.scan-count{font-size:15px}
.scan-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.vbox{position:relative;width:0;height:0}
.vbox video{display:block;width:100%;height:100%;object-fit:fill;background:#111}
.guide{position:absolute;left:8%;right:8%;top:4%;bottom:4%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);transition:border-color .2s}
.guide.ok{border-color:#7EE0B8}.guide.dup{border-color:#F2C14E}
.scan-msg{margin:12px 16px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.14);font-size:15px;line-height:1.5;min-height:54px;display:flex;align-items:center;gap:10px}
.scan-msg.ok{background:#2E8A64}.scan-msg.dup{background:#7A6115}.scan-msg.err{background:#8A2E2E}
.scan-msg .msgtext{flex:1}
.scan-msg .undo{background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;flex:none}
.scan-bottom{display:flex;align-items:center;gap:14px;padding:0 16px 12px}
.scan-bottom span{font-size:12px;color:#BBB;line-height:1.5}
#shutter{width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:var(--purple);flex:none}
#shutter:active{transform:scale(.94)}
#shutter:disabled{opacity:.4}
.irow{display:grid;grid-template-columns:1fr 84px 30px;grid-template-areas:"n p x" "c c c";gap:6px 8px;padding:10px 16px;background:var(--row);border-top:1px solid var(--line)}
.irow .n{grid-area:n}.irow .p{grid-area:p}.irow .x{grid-area:x}.irow .c{grid-area:c}
.irow input{border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px;padding:8px;min-width:0;width:100%;color:var(--ink)}
.irow .p{text-align:right;font-variant-numeric:tabular-nums}
.irow .x{border:none;background:none;color:#AAA;font-size:20px;padding:0}
.irow .c{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.sheet .irow .c select,.sheet .bulk select{direction:ltr;text-align:left;max-width:none;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;padding:5px 12px;color:var(--ink)}
.split{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 4px}
.chipc{background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chipc .dot{width:10px;height:10px}
.hint{font-size:12px;color:var(--sub);padding:2px 16px 0;line-height:1.6}
.addline{display:block;width:100%;text-align:left;background:var(--row);border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--purple-d);font-size:15px;padding:14px 16px}
.bulk{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;font-size:13px;color:var(--sub)}
.bulk select{border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;padding:4px 10px;color:var(--ink)}
.rv{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.rv .top{display:flex;justify-content:space-between;gap:10px;font-size:17px}
.rv .top span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .chips{display:flex;flex-wrap:wrap;gap:6px}
.rv .chips .chipc{background:#F3F0F5;font-size:12px;padding:2px 8px}
.bkbanner{margin:16px auto 0;width:calc(100% - 32px);max-width:520px;background:#FFF8E6;border:1px solid #F0DDA8;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.5;color:#6B5410}
.bkbanner span{flex:1}
.bkbanner button{background:var(--purple);color:#fff;border:none;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;flex:none}
.keybox{margin:0 16px;background:#fff;border-radius:10px;padding:12px;font-size:14px;line-height:1.7;user-select:all;-webkit-user-select:all;word-break:break-all}
.aion{display:inline-block;font-size:11px;background:var(--purple-soft);color:var(--purple-d);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.pulse{width:10px;height:10px;border-radius:50%;background:#C9A6DE;flex:none;animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.busy{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.busy div{background:#fff;border-radius:16px;padding:22px 26px;font-size:15px;min-width:220px;text-align:center}
.busy .bar{height:6px;background:var(--purple-soft);border-radius:3px;margin-top:12px;overflow:hidden}
.busy .bar i{display:block;height:100%;background:var(--purple);width:0;transition:width .2s}

/* アヒルとウサギ */
.mascot{position:relative;margin:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(120,90,140,.16)}
.mstage{position:relative}
.mascot svg{display:block;width:100%;height:auto;cursor:pointer}
.mascot .bub{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:max-content;max-width:86%;background:rgba(255,255,255,.96);border-radius:14px;padding:7px 13px;font-size:14px;line-height:1.4;color:#4A3F52;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center;pointer-events:none;animation:mPop .35s cubic-bezier(.3,1.5,.6,1)}
.mascot .bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(255,255,255,.96)}
.mchip{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;background:#fff;color:var(--purple-d);font-size:13px;font-weight:600;padding:10px 14px 0;text-align:left}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;width:100%;border:none;background:#fff;padding:10px 14px 12px;font-size:13px;color:#6B5F73;text-align:left}
.mbar i{display:block;flex-basis:100%;height:6px;border-radius:3px;background:#EEE9F1;overflow:hidden}
.mbar i b{display:block;height:100%;border-radius:3px}
.mascot .ch,.mascot .ear,.mascot .sway,.mascot .bounce,.mascot .shd,.mascot .kite,.mascot .hang,.mascot .frog,.mascot .flame{transform-box:fill-box;transform-origin:50% 100%}
.mascot .shd{transform-origin:50% 50%}
.mascot .arm{transform-box:fill-box;transform-origin:50% 8%}
.mascot .blink,.mascot .coin,.mascot .ripple,.mascot .spin,.mascot .flap,.mascot .glow,.mascot .flash2,.mascot .sizzle{transform-box:fill-box;transform-origin:50% 50%}
.mascot .tail{transform-box:fill-box;transform-origin:0% 80%;animation:mWag 1.8s ease-in-out infinite}
.mascot .blink{animation:mBlink 4.6s infinite}
.mascot .rab .blink{animation-delay:-1.7s}
.mascot .k-idle{animation:mIdle 2.8s ease-in-out infinite}
.mascot .rab.k-idle{animation-delay:-1.1s}
.mascot .k-idle .earR,.mascot .k-happy .earR,.mascot .k-groove .earR{animation:mTwitch 5.5s ease-in-out infinite}
.mascot .k-happy{animation:mHop 1.15s cubic-bezier(.45,0,.55,1) infinite}
.mascot .rab.k-happy{animation-delay:-.3s}
.mascot .k-hopfast{animation:mJump .7s cubic-bezier(.45,0,.55,1) infinite}
.mascot .k-groove{animation:mGroove 1.1s ease-in-out infinite}
.mascot .rab.k-groove{animation-delay:-.55s}
.mascot .k-exercise{animation:mJump .9s ease-in-out infinite}
.mascot .k-exercise .armL{animation:mArmL .9s ease-in-out infinite}
.mascot .k-exercise .armR{animation:mArmR .9s ease-in-out infinite}
.mascot .k-clap{animation:mHop 1.4s ease-in-out infinite}
.mascot .k-clap .armL{animation:mClapL .3s ease-in-out infinite alternate}
.mascot .k-clap .armR{animation:mClapR .3s ease-in-out infinite alternate}
.mascot .k-sad{animation:mSigh 3.2s ease-in-out infinite}
.mascot .k-sad .earL{transform:rotate(-58deg)}
.mascot .k-sad .earR{transform:rotate(58deg)}
.mascot .k-sleep{animation:mBreathe 3.4s ease-in-out infinite}
.mascot .k-sleep .earL{transform:rotate(-30deg)}
.mascot .k-sleep .earR{transform:rotate(30deg)}
.mascot .shd-happy{animation:mShd 1.15s cubic-bezier(.45,0,.55,1) infinite}
.mascot .shd-happy.rabs{animation-delay:-.3s}
.mascot .shd-hopfast{animation:mShd2 .7s cubic-bezier(.45,0,.55,1) infinite}
.mascot .shd-exercise{animation:mShd2 .9s ease-in-out infinite}
.mascot .shd-clap{animation:mShd 1.4s ease-in-out infinite}
.jump .ch{animation:mTap .55s ease-out!important}
.mascot .sway{animation:mSway 3s ease-in-out infinite}
.mascot .kite{transform-origin:50% 20%;animation:mKite 2.6s ease-in-out infinite}
.mascot .hang{transform-origin:50% 0%;animation:mSway 2.4s ease-in-out infinite}
.mascot .bounce{animation:mBall 1.2s cubic-bezier(.5,0,.5,1) infinite}
.mascot .steam,.mascot .smoke{animation:mSmoke 3s ease-out infinite}

.mascot .rainf{animation-name:mRain}
.mascot .blow{animation-name:mBlow}
.mascot .tw{animation:mTw 2.6s ease-in-out infinite}
.mascot .up,.mascot .note{animation:mRise 2.8s ease-out infinite;font-weight:700}
.mascot .bat{animation:mBat 5s ease-in-out infinite}
.mascot .drift{animation:mDrift 40s linear infinite}
.mascot .spin{animation:mSpin 16s linear infinite}
.mascot .flash,.mascot .bolt{opacity:0;animation:mFlash 6s linear infinite}
.mascot .flash2{opacity:0;animation:mFlash2 3.2s linear infinite}
.mascot .ripple{animation:mRipple 1.8s ease-out infinite}
.mascot .bob{animation:mBob 1.6s ease-in-out infinite}
.mascot .fishjump{opacity:0;animation:mFish 5s ease-in-out infinite}
.mascot .flip{transform-box:fill-box;transform-origin:0% 50%;animation:mFlip 4s ease-in-out infinite}
.mascot .drip{animation:mDrip 1s linear infinite}
.mascot .bbl{animation:mBubble 3.8s ease-out infinite}
.mascot .coin{animation:mCoin 2.6s ease-in infinite}
.mascot .pass{animation:mPass 2.2s ease-in-out infinite}
.mascot .flame{animation:mFlame .5s ease-in-out infinite alternate}
.mascot .glow{animation:mTw 1.6s ease-in-out infinite}
.mascot .flap{animation:mFlap .25s ease-in-out infinite alternate}
.mascot .flutter{animation:mFlutter 9s ease-in-out infinite}
.mascot .splash{animation:mSplash 1.15s ease-out infinite}
.mascot .frog{animation:mFrog 2.4s ease-in-out infinite}
.mascot .crawl{animation:mCrawl 26s linear infinite alternate}
.mascot .pop{animation:mPopLeaf 2.2s ease-out infinite}
.mascot .rise{animation:mRiseB 9s ease-in infinite}
.mascot .sizzle{animation:mBreathe .6s ease-in-out infinite}

.mascot .shoot{opacity:0;animation:mShoot 7s ease-in infinite}
@keyframes mPop{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes mIdle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2px) scale(.99,1.015)}}
@keyframes mHop{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.07,.93)}42%{transform:translateY(-13px) scale(.96,1.04)}72%{transform:translateY(0) scale(1.05,.95)}86%{transform:translateY(0) scale(.99,1.01)}}
@keyframes mShd{0%,12%,72%,100%{transform:scale(1);opacity:.1}42%{transform:scale(.75);opacity:.05}}
@keyframes mShd2{0%,100%{transform:scale(1)}50%{transform:scale(.72)}}
@keyframes mJump{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-15px) scale(.98,1.02)}}
@keyframes mGroove{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-3px)}}
@keyframes mTwitch{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(14deg)}94%{transform:rotate(0)}97%{transform:rotate(8deg)}}
@keyframes mWag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
@keyframes mBlink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes mArmL{0%,100%{transform:rotate(0)}50%{transform:rotate(150deg)}}
@keyframes mArmR{0%,100%{transform:rotate(0)}50%{transform:rotate(-150deg)}}
@keyframes mClapL{from{transform:rotate(10deg)}to{transform:rotate(-55deg)}}
@keyframes mClapR{from{transform:rotate(-10deg)}to{transform:rotate(55deg)}}
@keyframes mSigh{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(3px) rotate(-3deg)}}
@keyframes mBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,1.04)}}
@keyframes mTap{0%{transform:translateY(0) scale(1.1,.88)}40%{transform:translateY(-26px) scale(.94,1.07)}75%{transform:translateY(0) scale(1.06,.94)}100%{transform:translateY(0) scale(1,1)}}
@keyframes mSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes mKite{0%,100%{transform:rotate(-8deg) translate(0,0)}50%{transform:rotate(8deg) translate(6px,-4px)}}
@keyframes mBall{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes mSmoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.75}100%{transform:translate(6px,-34px) scale(1.4);opacity:0}}
@keyframes mFall{from{transform:translate(0,-20px) rotate(0)}to{transform:translate(24px,242px) rotate(260deg)}}
@keyframes mRain{from{transform:translate(0,-20px)}to{transform:translate(-14px,242px)}}
@keyframes mBlow{from{transform:translate(-60px,-10px) rotate(0)}to{transform:translate(380px,210px) rotate(400deg)}}
@keyframes mTw{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes mRise{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(10px,-40px)}}
@keyframes mBat{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-8px)}}
@keyframes mDrift{from{transform:translateX(-80px)}to{transform:translateX(440px)}}
@keyframes mSpin{to{transform:rotate(360deg)}}
@keyframes mFlash{0%,88%,92%,96%,100%{opacity:0}89%,94%{opacity:.8}}
@keyframes mFlash2{0%,80%,88%,100%{opacity:0}82%{opacity:.95}}
@keyframes mRipple{from{transform:scale(.3);opacity:1}to{transform:scale(2.4);opacity:0}}
@keyframes mBob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes mFish{0%,55%,100%{opacity:0;transform:translate(-14px,4px) rotate(30deg)}62%{opacity:1}70%{transform:translate(0,-22px) rotate(0)}78%{opacity:1}84%{opacity:0;transform:translate(14px,4px) rotate(-30deg)}}
@keyframes mFlip{0%,60%,100%{transform:scaleX(1)}75%,90%{transform:scaleX(-1)}}
@keyframes mDrip{from{transform:translateY(0);opacity:1}to{transform:translateY(30px);opacity:0}}

@keyframes mCoin{0%{transform:translateY(-60px) scale(1);opacity:0}15%{opacity:1}70%{transform:translateY(0) scale(1);opacity:1}85%,100%{transform:translateY(4px) scale(.4);opacity:0}}
@keyframes mPass{0%,100%{transform:translate(-40px,0)}25%{transform:translate(0,-44px)}50%{transform:translate(40px,0)}75%{transform:translate(0,-44px)}}
@keyframes mFlame{from{transform:scale(1,1)}to{transform:scale(.88,1.12)}}
@keyframes mFlap{from{transform:scaleX(1)}to{transform:scaleX(.3)}}
@keyframes mFlutter{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-14px)}50%{transform:translate(20px,18px)}75%{transform:translate(-24px,6px)}}
@keyframes mSplash{0%,10%{transform:translate(0,0);opacity:0}15%{opacity:1}60%{transform:translate(var(--dx,10px),-16px)}100%{transform:translate(calc(var(--dx,10px) * 1.4),0);opacity:0}}
@keyframes mFrog{0%,60%,100%{transform:translateY(0) scale(1,1)}70%{transform:translateY(0) scale(1.1,.9)}80%{transform:translateY(-14px) scale(.95,1.05)}90%{transform:translateY(0)}}
@keyframes mCrawl{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
@keyframes mPopLeaf{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:1}50%{transform:translate(var(--dx,10px),-30px) rotate(180deg)}100%{transform:translate(calc(var(--dx,10px) * 1.6),4px) rotate(360deg);opacity:0}}
@keyframes mRiseB{0%{transform:translate(0,0);opacity:1}80%{opacity:1}100%{transform:translate(20px,-190px);opacity:0}}
@keyframes mRope{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-2.6)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes mShoot{0%,70%{opacity:0;transform:translate(90px,20px)}74%{opacity:1}88%{opacity:0;transform:translate(220px,66px)}100%{opacity:0;transform:translate(220px,66px)}}
@media (prefers-reduced-motion:reduce){.mascot *{animation:none!important}}
</style>
</head>
<body>
<header class="hdr" id="hdr"></header>
<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="input"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zm17.7-10.2a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>入力</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M7.5 11h9M7.5 14.5h9M7.5 18h6" stroke-linecap="round"/></svg>カレンダー</button>
  <button data-tab="graph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 3.05A9 9 0 1 0 20.95 13H11V3.05z"/><path d="M13 2.05V11h8.95A9 9 0 0 0 13 2.05z" opacity=".55"/></svg>グラフ</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>設定</button>
</nav>

<div class="scanner" id="scanner" hidden>
  <div class="scan-top">
    <span class="scan-count" id="scanCount">登録 0件</span>
    <button id="closeScan">完了</button>
  </div>
  <div class="scan-stage" id="stage">
    <div class="vbox" id="vbox">
      <video id="video" playsinline muted autoplay></video>
      <div class="guide" id="guide"></div>
    </div>
  </div>
  <div class="scan-msg" id="scanMsg"><span class="pulse"></span><span id="scanText">カメラを起動中…</span></div>
  <div class="scan-bottom"><button id="shutter" aria-label="今すぐ読み取る"></button><span>自動で読み取ります。うまくいかない時はボタンで撮影</span></div>
</div>

<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="rsFile" accept=".json,application/json" hidden>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="busy" id="busy" hidden><div><span id="busyText">読み取り中…</span><div class="bar"><i id="busyBar"></i></div></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
/* ================= 基本 ================= */
const EXP_CATS=[
  ["食費","#8CC394"],["外食費","#F2B659"],["日用品","#4DA6DA"],["交通費","#E2678F"],["衣服・靴・バッグ","#3E3B55"],
  ["趣味","#D65A55"],["交際費","#C7D9A6"],["医療費","#7CC5B6"],["車","#4E9C78"],["通信費","#7884C6"],
  ["光熱費","#EFA27A"],["家に納める用","#BDB6B2"],["その他","#E8E1EF"]];
const INC_CATS=[["給料","#4DA6DA"],["副業","#8CC394"],["ボーナス","#F2B659"],["その他収入","#BDB6B2"]];
const catColor=(c,type)=>((type==="income"?INC_CATS:EXP_CATS).find(x=>x[0]===c)||[0,"#CCC"])[1];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yenJ=n=>Math.round(n||0).toLocaleString("ja-JP")+"円";
const WD="日月火水木金土";
const APP_VERSION="1.9";
const dayLabel=s=>{const d=new Date(s+"T00:00");return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`};
const md=s=>{const d=new Date(s+"T00:00");return `${d.getMonth()+1}/${d.getDate()}`};
const monthKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const SCAN_ICON=`<svg class="scanmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 12h8"/></svg>`;

/* ================= 保存（IndexedDB・このiPhoneの中だけ） ================= */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("kakeibo",2);
    r.onupgradeneeded=()=>{const db=r.result,has=n=>db.objectStoreNames.contains(n);
      if(!has("receipts"))db.createObjectStore("receipts",{keyPath:"id"});
      if(!has("images"))db.createObjectStore("images");
      if(!has("snapshots"))db.createObjectStore("snapshots",{keyPath:"at"})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx("receipts","readonly",s=>s.getAll())},
  put(e){return this.tx("receipts","readwrite",s=>s.put(e))},
  del(id){return this.tx("receipts","readwrite",s=>s.delete(id))},
  clear(){return this.tx("receipts","readwrite",s=>s.clear())},
  snaps(){return this.tx("snapshots","readonly",s=>s.getAll())},
  putSnap(x){return this.tx("snapshots","readwrite",s=>s.put(x))},
  delSnap(at){return this.tx("snapshots","readwrite",s=>s.delete(at))},
  clearImages(){return this.tx("images","readwrite",s=>s.clear())}
};
/* 旧版のデータを新しい形に */
const OLD_CAT={"外食":"外食費","交通":"交通費","衣服":"衣服・靴・バッグ","娯楽":"趣味","医療":"医療費"};
function migrate(e){
  const {hasImage,...x}=e;
  if(x.amount==null){x.amount=+x.total||0;delete x.total}
  if(!x.type)x.type="expense";
  if(OLD_CAT[x.category])x.category=OLD_CAT[x.category];
  if(x.memo==null)x.memo=x.store||"";
  return x;
}

let entries=[];
const S={tab:"input",month:firstOfMonth(new Date()),inputType:"expense",graphMode:"expense",selDay:null,
  form:{amount:"",category:"食費",memo:"",date:today()}};
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1)}

async function addEntry(e){await DB.put(e);entries.push(e);BK.touch()}
async function updateEntry(e){await DB.put(e);entries=entries.map(x=>x.id===e.id?e:x);BK.touch()}
async function removeEntry(id){await DB.del(id);entries=entries.filter(x=>x.id!==id);BK.touch()}
/* バックアップ（「ファイル」アプリへの保存）の管理 */
const BK={
  get(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}},
  set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}},
  get last(){return this.get("kb_lastBackup")},get dirty(){return this.get("kb_dirty")},
  touch(){this.set("kb_dirty",this.dirty+1)},
  done(){this.set("kb_lastBackup",Date.now());this.set("kb_dirty",0)},
  get due(){const d=this.dirty;if(!d||!entries.length)return false;return d>=10||Date.now()-this.last>7*864e5}
};
function backupJSON(){return JSON.stringify({app:"kakeibo",version:1,exported:new Date().toISOString(),entries},null,0)}
async function doBackup(){
  const ok=await shareOrDownload(`家計簿バックアップ-${today()}.json`,backupJSON(),"application/json");
  if(ok){BK.done();toast("バックアップしました");render()}
}
function backupBannerHTML(){
  if(!BK.due)return "";
  const t=BK.last?`前回のバックアップから${BK.dirty}件の変更があります。`:`まだバックアップしていません。`;
  return `<div class="bkbanner"><span>${t}「ファイル」に保存しておくと、消えても戻せます。</span><button id="bkNow">保存</button></div>`;
}
/* 週1回：アプリを開いた時にバックアップ画面を出す（iPhoneの仕組み上、保存ボタンだけは自分で押す必要があります） */
function weeklyBackupCheck(){
  if(!entries.length||!bg.hidden||!scannerEl.hidden)return;
  const week=7*864e5,now=Date.now();
  if(BK.last&&now-BK.last<week)return;
  if(now-BK.get("kb_prompted")<20*3600e3)return;   // 「あとで」は翌日まで出さない
  BK.set("kb_prompted",now);
  const first=!BK.last;
  openSheet(`<div class="sh"><span style="width:52px"></span><b>週1回のバックアップ</b><span style="width:52px"></span></div>
    <div class="note" style="font-size:15px">記録 ${entries.length}件を「ファイル」アプリに保存します。<br><br>
    ${first?`<b>はじめての時だけ</b><br>次の画面で「ファイルに保存」→「iCloud Drive」→ 右上のフォルダボタンで「<b>家計簿</b>」フォルダを作成 → その中で「保存」<br><br>2回目からは「家計簿」フォルダが選ばれた状態で開くので、<b>「ファイルに保存」→「保存」の2タップ</b>で終わります。`
    :`「ファイルに保存」→「保存」の2タップで、「家計簿」フォルダに保存されます。`}</div>
    <div class="btnrow" style="flex-direction:column"><button class="btn-p" id="wkGo">バックアップを保存</button><button class="btn-g" id="wkLater">あとで</button></div>`);
  sheet.querySelector("#wkGo").onclick=()=>{closeSheet();doBackup()};
  sheet.querySelector("#wkLater").onclick=closeSheet;
}
/* アプリ内の自動保存：週1回、記録のコピーを最大8週分とっておく（間違って消した時に戻せる） */
async function autoSnapshot(){
  try{
    if(!entries.length)return;
    const list=(await DB.snaps()||[]).sort((a,b)=>b.at-a.at);
    if(list[0]&&Date.now()-list[0].at<6*864e5)return;
    await DB.putSnap({at:Date.now(),count:entries.length,entries:JSON.parse(JSON.stringify(entries))});
    for(const x of list.slice(7))await DB.delSnap(x.at);
  }catch(e){}
}
async function openSnapshots(){
  let list=[];try{list=(await DB.snaps()||[]).sort((a,b)=>b.at-a.at)}catch(e){}
  openSheet(`<div class="sh"><button data-close>閉じる</button><b>アプリ内の自動保存</b><span style="width:52px"></span></div>
    <div class="note">週に1回、アプリの中に記録のコピーを自動でとっています（最大8週分）。間違って消した時などに戻せます。<br>※アプリ自体を削除すると、これも消えます。</div>
    ${list.length?`<div class="list" style="border-top:1px solid var(--line);border-bottom:1px solid var(--line)">${list.map(x=>{const d=new Date(x.at);
      return `<button class="item" data-snap="${x.at}"><span class="t">${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}</span><span class="a">${x.count}件</span><span class="chev">›</span></button>`}).join("")}</div>`
      :`<div class="empty">まだありません。来週から自動でたまります。</div>`}`);
  sheet.querySelectorAll("[data-snap]").forEach(b=>b.onclick=()=>{
    const x=list.find(y=>String(y.at)===b.dataset.snap);if(!x)return;
    const have=new Set(entries.map(e=>e.id)),miss=x.entries.filter(e=>!have.has(e.id)).map(migrate);
    openSheet(`<div class="sh"><button data-close>閉じる</button><b>自動保存から戻す</b><span style="width:52px"></span></div>
      <div class="note">この時点の記録 ${x.count}件のうち、今のアプリにない記録が${miss.length}件あります。</div>
      <div class="btnrow"><button class="btn-g" data-close>やめる</button><button class="btn-p" id="snapGo"${miss.length?"":" disabled"}>${miss.length}件を戻す</button></div>`);
    sheet.querySelector("#snapGo").onclick=async()=>{for(const e of miss){await DB.put(e);entries.push(e)}closeSheet();toast(`${miss.length}件 戻しました`);render()};
  });
}
function bindBanner(){const b=view.querySelector("#bkNow");if(b)b.onclick=doBackup}

let toastT;
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ================= 画面切り替え ================= */
const hdr=document.getElementById("hdr"),view=document.getElementById("view");
document.querySelectorAll("#tabbar button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.selDay=null;render();scrollTo(0,0)});

/* ================= アヒルとウサギ（入力画面のキャラ） =================
   毎日の「今日のシーン」を、AI（Gemini・1日1回）か内蔵の25シーンから決める。アプリを更新しなくても毎日変わる。
   さらに 天気・時間帯・季節/行事・今月のお金のペース・レシート登録 で動きとセリフが変わる */
const MS={
  get budget(){try{return +localStorage.getItem("kb_budget")||0}catch(e){return 0}},
  set budget(v){try{v?localStorage.setItem("kb_budget",String(v)):localStorage.removeItem("kb_budget")}catch(e){}},
  idx:0,st:null,jt:0
};
const dayNum=d=>Math.round(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/864e5);
function mRand(seed){let s=(seed*7919+13)%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
const M_COL=["#F28DB2","#7FB8E8","#9AD08C","#F5B85A","#B79AE0"];

/* ---------- 今の天気（Open-Meteo・無料、キー不要）。30分ごと。場所は刈谷市、設定で現在地にも ---------- */
const WX={
  get(){try{return JSON.parse(localStorage.getItem("kb_wx")||"null")}catch(e){return null}},
  save(x){try{localStorage.setItem("kb_wx",JSON.stringify(x))}catch(e){}},
  get gps(){try{return localStorage.getItem("kb_wxgps")==="1"}catch(e){return false}},
  set gps(v){try{v?localStorage.setItem("kb_wxgps","1"):localStorage.removeItem("kb_wxgps");localStorage.removeItem("kb_wx")}catch(e){}},
  busy:false,
  async load(force){
    const c=this.get();if(!force&&c&&Date.now()-c.at<30*60e3)return;if(this.busy)return;this.busy=true;
    try{
      let lat="34.99",lon="137.00";
      if(this.gps&&navigator.geolocation){const p=await new Promise(res=>navigator.geolocation.getCurrentPosition(x=>res(x.coords),()=>res(null),{maximumAge:3*3600e3,timeout:8000}));
        if(p){lat=p.latitude.toFixed(2);lon=p.longitude.toFixed(2)}}
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`);
      const cu=(await r.json()).current;if(!cu)return;
      this.save({at:Date.now(),code:cu.weather_code,t:cu.temperature_2m,wind:cu.wind_speed_10m});refreshMascot();
    }catch(e){}finally{this.busy=false}
  },
  now(){const c=this.get();if(!c||Date.now()-c.at>3*3600e3)return null;const k=c.code;
    const sky=k>=95?"thunder":(k>=71&&k<=77)||k===85||k===86?"snow":(k>=51&&k<=67)||(k>=80&&k<=82)?"rain":k===45||k===48?"fog":k===3?"cloudy":k===2||k===1?"partly":"clear";
    return {sky,t:c.t,hot:c.t>=30,cold:c.t<=5,windy:c.wind>=30}}
};

/* ---------- 今の状況 ---------- */
function mCtx(){
  const now=new Date(),h=now.getHours(),mo=now.getMonth()+1,d=now.getDate(),seed=dayNum(now),mmdd=mo*100+d;
  const time=h>=5&&h<10?"morning":h>=10&&h<16?"day":h>=16&&h<19?"evening":h>=19&&h<22?"yoru":"night";
  const ev=mmdd>=1024&&mmdd<=1031?"halloween":mmdd>=1218&&mmdd<=1225?"xmas":mmdd>=101&&mmdd<=107?"newyear":
    mmdd===214?"valentine":mmdd===707?"tanabata":mmdd>=325&&mmdd<=415?"sakura":null;
  const season=(mo===12||mo<=2)?"winter":mo<=5?"spring":mo<=8?"summer":"autumn";
  const wx=WX.now(),wet=!!wx&&(wx.sky==="rain"||wx.sky==="thunder"),snowy=!!wx&&wx.sky==="snow";
  const dim=new Date(now.getFullYear(),mo,0).getDate();
  const spent=entries.filter(e=>e.type!=="income"&&e.date.startsWith(monthKey(now))).reduce((a,e)=>a+e.amount,0);
  const B=MS.budget;let money=null,mmsg="";
  if(B){const pace=B*d/dim;
    if(spent>B){money="over";mmsg=`予算を${yenJ(spent-B)}オーバー…あと${dim-d}日、いっしょに節約しよ`}
    else if(spent>pace*1.1){money="warn";mmsg=`ちょっと使いすぎペースかも。残り${yenJ(B-spent)}だよ`}
    else{money="good";mmsg=`いい感じ！今月はあと${yenJ(B-spent)}使えるよ`}
  }else{
    const pk=monthKey(new Date(now.getFullYear(),now.getMonth()-1,1));
    const prev=entries.filter(e=>e.type!=="income"&&e.date.startsWith(pk)&&+e.date.slice(8,10)<=d).reduce((a,e)=>a+e.amount,0);
    if(prev>0&&spent>0){
      if(spent>prev*1.1){money="warn";mmsg=`先月の同じ日より${yenJ(spent-prev)}多いペースだよ`}
      else{money="good";mmsg=spent<prev?`先月より${yenJ(prev-spent)}少ないペース！えらい`:"先月と同じくらいのペースだよ"}
    }
  }
  const t0=new Date(now.getFullYear(),now.getMonth(),d).getTime();
  const todays=entries.filter(e=>e.type!=="income"&&(e.created||0)>=t0);
  const lastAdd=todays.reduce((a,e)=>Math.max(a,e.created||0),0);
  return {now,h,mo,d,seed,time,ev,season,wx,wet,snowy,dim,spent,B,money,mmsg,nToday:todays.length,justAdded:lastAdd&&Date.now()-lastAdd<90*60e3};
}

/* ---------- 今日のシーン：AI（1日1回）か内蔵 ---------- */
function themeOK(t,c){
  const late=c.time==="yoru"||c.time==="night";
  if(t.wet)return c.wet;
  if(t.snow)return c.snowy;
  if(c.wet||c.snowy)return !!t.any;
  if(t.night)return late&&(!c.wx||c.wx.sky==="clear"||c.wx.sky==="partly");
  if(t.eve&&!(c.time==="evening"||late))return false;
  if(t.day&&late)return false;
  if(t.morning&&c.time!=="morning")return false;
  if(t.months&&!t.months.includes(c.mo))return false;
  return true;
}
const SC={
  get(){try{return JSON.parse(localStorage.getItem("kb_scene")||"null")}catch(e){return null}},
  save(x){try{localStorage.setItem("kb_scene",JSON.stringify(x))}catch(e){}},
  hist(){try{return JSON.parse(localStorage.getItem("kb_scene_hist")||"[]")}catch(e){return[]}},
  busy:false,lastTry:0,
  async gen(force){
    if(!AI.on||this.busy)return;const d=today(),cur=this.get();
    if(!force&&cur&&cur.date===d)return;if(!force&&Date.now()-this.lastTry<3600e3)return;
    this.busy=true;this.lastTry=Date.now();
    try{
      const c=mCtx(),h=this.hist().filter(x=>x!==(cur&&cur.date===d?"":"")).slice(0,6);
      const ok=TH.filter(t=>themeOK(t,{...c,time:"day"})&&!t.night&&!t.eve&&!t.morning);
      if(!ok.length)return;
      const wxs=c.wx?({clear:"晴れ",partly:"晴れときどきくもり",cloudy:"くもり",rain:"雨",thunder:"雷雨",snow:"雪",fog:"霧"}[c.wx.sky]+`、${Math.round(c.wx.t)}℃`):"不明";
      const EVN={halloween:"ハロウィン",xmas:"クリスマス",newyear:"お正月",valentine:"バレンタイン",tanabata:"七夕",sakura:"桜の季節"};
      const money=c.money==="over"?"予算オーバー（節約を応援してほしい）":c.money==="warn"?"少し使いすぎペース（やさしく注意）":c.money==="good"?"順調（ほめてほしい）":"不明";
      const prompt=`家計簿アプリのマスコット「アヒル」と「ウサギ」（仲良しの2匹）の、今日のシーンを考えてください。
今日：${c.mo}月${c.d}日(${WD[c.now.getDay()]}) ／ 季節：${{winter:"冬",spring:"春",summer:"夏",autumn:"秋"}[c.season]} ／ 行事：${EVN[c.ev]||"なし"} ／ 天気：${wxs}
今月のお金：${money}
最近使ったテーマ（今日は避ける）：${h.join(", ")||"なし"}
次のテーマから、今日に一番合うものを1つ選んで theme に入れてください：
${ok.map(t=>`- ${t.id}：${t.name}`).join("\n")}
lines：2匹のセリフを4つ。それぞれ18文字以内のやさしく楽しい日本語。テーマ・季節・天気に合わせる。そのうち1つはお金や節約についての前向きなひとこと（今月のお金の状況に合わせる）。絵文字は使っても1つまで。「おはよう」など時刻に関係する言葉は使わない。
item_svg：そのシーンに合うかわいい小物を1つ、SVGの中身だけ（<svg>タグは書かない）。座標は x 0〜60、y 0〜60 で、地面は y=60（小物の下端を地面につける）。使えるのは g, circle, ellipse, rect, path, polygon, line だけ。色は #RRGGBB。文字・画像・グラデーションは使わない。要素は20個まで。やわらかいパステル調のフラットなイラストで。`;
      const schema={type:"OBJECT",properties:{theme:{type:"STRING",enum:ok.map(t=>t.id)},lines:{type:"ARRAY",items:{type:"STRING"}},item_svg:{type:"STRING"}},required:["theme","lines","item_svg"]};
      const j=JSON.parse(await aiRun([{text:prompt}],schema,1));
      if(!TH.some(t=>t.id===j.theme))return;
      const lines=(Array.isArray(j.lines)?j.lines:[]).map(s=>String(s).trim().slice(0,30)).filter(Boolean).slice(0,4);
      this.save({date:d,theme:j.theme,lines,svg:cleanSVG(j.item_svg||""),by:"ai"});
      try{localStorage.setItem("kb_scene_hist",JSON.stringify([j.theme,...this.hist().filter(x=>x!==j.theme)].slice(0,7)))}catch(e){}
      MS.idx=0;refreshMascot();
    }catch(e){}finally{this.busy=false}
  }
};
/* AIが描いた小物は、安全な図形だけ残す */
function cleanSVG(src){
  try{
    const doc=new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${String(src).replace(/<\/?svg[^>]*>/gi,"")}</svg>`,"image/svg+xml");
    if(doc.getElementsByTagName("parsererror").length)return "";
    const TAGS=new Set(["g","circle","ellipse","rect","path","polygon","polyline","line"]);
    const ATTR=new Set(["d","cx","cy","r","rx","ry","x","y","width","height","points","x1","y1","x2","y2","fill","stroke","stroke-width","stroke-linecap","stroke-linejoin","opacity","fill-opacity","transform"]);
    let n=0;
    const walk=el=>{let out="";for(const ch of el.children){const t=ch.localName;if(!TAGS.has(t)||++n>40)continue;let a="";
      for(const at of ch.attributes){const k=at.name,v=at.value;if(!ATTR.has(k)||v.length>600)continue;
        if(k==="fill"||k==="stroke"){if(!/^(#[0-9a-f]{3,8}|none)$/i.test(v))continue}
        else if(!/^[\d\s.,\-a-zA-Z()]*$/.test(v)||/url|script|expression/i.test(v))continue;
        a+=` ${k}="${v}"`}
      out+=`<${t}${a}>${t==="g"?walk(ch):""}</${t}>`}return out};
    return walk(doc.documentElement);
  }catch(e){return ""}
}
function mScene(c){
  const ok=TH.filter(t=>themeOK(t,c)),rec=SC.get();
  if(rec&&rec.date===today()){const t=TH.find(x=>x.id===rec.theme);if(t&&themeOK(t,c))return {t,lines:rec.lines&&rec.lines.length?rec.lines:t.lines,svg:rec.svg||"",by:rec.by}}
  const h=SC.hist(),late=c.time==="yoru"||c.time==="night";
  let i=((c.seed*37+(late?11:0))%ok.length+ok.length)%ok.length;
  if(ok.length>1&&ok[i].id===h[0])i=(i+1)%ok.length;
  if((c.money==="over"||c.money==="warn")&&c.seed%3===0){const p=ok.findIndex(t=>t.id==="piggy");if(p>=0)i=p}
  const t=ok[i]||TH[0];return {t,lines:t.lines,svg:"",by:""};
}

/* 1枚のレシートを、品目のカテゴリーごとの行に分ける（税・値引きは金額の割合で割り振り） */
function memoOf(store,names){return (store||"")+(names.length?`（${names.slice(0,4).join("、")}${names.length>4?"…":""}）`:"")}
function pieces(e){
  const base={id:e.id,entry:e,type:e.type||"expense"};
  const its=(e.items||[]).filter(i=>i.price);
  if(e.type==="income"||!its.length)return[{...base,category:e.category,amount:e.amount,memo:e.memo||""}];
  const g={};
  its.forEach(i=>{const c=i.category||e.category;g[c]=g[c]||{sum:0,names:[]};g[c].sum+=i.price;if(i.price>0)g[c].names.push(i.name)});
  const keys=Object.keys(g),sum=keys.reduce((a,k)=>a+g[k].sum,0),r=sum>0?e.amount/sum:0;
  if(keys.length===1||r<0.5||r>2)
    return[{...base,category:keys.length===1?keys[0]:e.category,amount:e.amount,memo:memoOf(e.store,its.filter(i=>i.price>0).map(i=>i.name))}];
  const out=keys.map(k=>({...base,category:k,raw:g[k].sum*r,amount:Math.round(g[k].sum*r),memo:memoOf(e.store,g[k].names)}));
  const diff=e.amount-out.reduce((a,x)=>a+x.amount,0);
  if(diff)out.slice().sort((a,b)=>b.raw-a.raw)[0].amount+=diff;
  return out.filter(x=>x.amount).sort((a,b)=>b.amount-a.amount);
}
function splitOf(e){const m={};pieces(e).forEach(x=>m[x.category]=(m[x.category]||0)+x.amount);return m}
function mainCategory(e){const m=splitOf(e);return Object.keys(m).sort((a,b)=>m[b]-m[a])[0]||e.category}
function chipsHTML(e){const m=splitOf(e);return Object.keys(m).sort((a,b)=>m[b]-m[a]).map(c=>`<span class="chipc"><span class="dot" style="background:${catColor(c,e.type)}"></span>${esc(c)} ${yenJ(m[c])}</span>`).join("")}
function listByDay(list,cat){
  if(!list.length)return `<div class="empty">この月の記録はありません。<br>「入力」からレシートをスキャンすると自動で追加されます。</div>`;
  const days={};list.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  return Object.keys(days).sort().reverse().map(d=>`<div class="dayhead" data-dh="${d}" style="scroll-margin-top:calc(env(safe-area-inset-top,0px) + 80px)">${dayLabel(d)}</div><div class="list">${
    days[d].sort((a,b)=>(b.time||"").localeCompare(a.time||"")||(b.created||0)-(a.created||0)).map(e=>itemHTML(e,cat)).join("")}</div>`).join("");
}
function itemHTML(e,cat){
  return pieces(e).filter(x=>!cat||x.category===cat).map(x=>`<button class="item" data-id="${esc(x.id)}"><span class="t">${esc(x.category)}${x.memo?`<small>(${esc(x.memo)})</small>`:""}</span>${e.source==="scan"?SCAN_ICON:""}<span class="a${x.type==="income"?" in":""}">${yenJ(x.amount)}</span></button>`).join("");
}

function donutSVG(parts,total){
  const cx=160,cy=160,R=150,r=62;
  if(!total)return `<svg viewBox="0 0 320 320"><circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="#E6E3E8" stroke-width="${R-r}"/><text x="160" y="166" text-anchor="middle" style="fill:#AAA;stroke:none">記録なし</text></svg>`;
  const p=(rad,a)=>[cx+rad*Math.sin(a),cy-rad*Math.cos(a)];
  let a=0,paths="",labels="";
  for(const x of parts){
    const sweep=x.v/total*Math.PI*2;
    const a1=a+Math.min(sweep,Math.PI*2-0.0001);
    const L=(a1-a)>Math.PI?1:0;const [x0,y0]=p(R,a),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a);
    paths+=`<path d="M${x0},${y0}A${R},${R} 0 ${L} 1 ${x1},${y1}L${x2},${y2}A${r},${r} 0 ${L} 0 ${x3},${y3}Z" fill="${x.col}" stroke="#fff" stroke-width="1"/>`;
    if(x.v/total>=0.07){const [lx,ly]=p((R+r)/2,(a+a1)/2);labels+=`<text x="${lx.toFixed(1)}" y="${(ly+5).toFixed(1)}" text-anchor="middle"${x.col==="#E8E1EF"||x.col==="#C7D9A6"?' style="fill:#555;stroke:none"':""}>${esc(x.c.length>5?x.c.slice(0,5):x.c)}</text>`}
    a+=sweep;
  }
  return `<svg viewBox="0 0 320 320" role="img" aria-label="カテゴリー別の割合">${paths}${labels}</svg>`;
}

async function shareOrDownload(name,text,type){

  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();

function ocrCanvas(src,crop){
  const scale=Math.min(2.5,1800/Math.min(crop.w,crop.h),3000/Math.max(crop.w,crop.h));
  const w=Math.round(crop.w*scale),h=Math.round(crop.h*scale);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(src,crop.x,crop.y,crop.w,crop.h,0,0,w,h);
  const d=g.getImageData(0,0,w,h),p=d.data,hist=new Uint32Array(256);
  for(let i=0;i<p.length;i+=4){const y=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0;p[i]=y;hist[y]++}
  let lo=0,hi=255,acc=0;const n=w*h;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>n*0.02){lo=i;break}}
  acc=0;for(let i=255;i>=0;i--){acc+=hist[i];if(acc>n*0.10){hi=i;break}}
  const r=Math.max(1,hi-lo);
  for(let i=0;i<p.length;i+=4){let v=(p[i]-lo)*255/r;v=v<0?0:v>255?255:v;p[i]=p[i+1]=p[i+2]=v}
  g.putImageData(d,0,0);return c;
}

/* ================= 解析ルール ================= */
const JA="぀-ヿ㐀-鿿ｦ-ﾟ";
function normalize(s){
  s=s.replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[￥\\]/g,"¥").replace(/　/g," ");
  s=s.replace(new RegExp("(["+JA+"])\\s+(?=["+JA+"])","g"),"$1");
  s=s.replace(/(\d)\s*,\s*(\d{3})/g,"$1,$2").replace(/(\d)\s+(?=\d{3}\b)/g,"$1");
  s=s.replace(/[Yy](?=\s*\d)/g,"¥");
  s=s.replace(/¥\s*((?:\d[\s,]*){1,8})/g,(_,n)=>"¥"+n.replace(/\s+/g,"").replace(/,$/,"")+" ").trim();
  return s.trim();
}
const amounts=line=>(line.match(/-?\d{1,3}(?:,\d{3})+|-?\d+/g)||[]).map(x=>parseInt(x.replace(/,/g,""),10)).filter(n=>!isNaN(n));
const NOT_STORE=["領収","レシート","TEL","Tel","電話","〒","http","登録番号","いらっしゃいませ","ありがとう","毎度","ようこそ","No.","レジ","責"];
function findStore(lines){
  for(let i=0;i<Math.min(8,lines.length);i++){
    const l=lines[i];if(NOT_STORE.some(k=>l.includes(k)))continue;
    const letters=(l.match(new RegExp("["+JA+"A-Za-z]","g"))||[]).length,digits=(l.match(/\d/g)||[]).length;
    if(letters>=2&&digits*2<l.length)return{i,name:l.replace(/[^\p{L}\p{N}・&ー\-\s]/gu,"").trim()};
  }
  return null;
}
function findDate(lines){
  for(const l of lines){
    let m=l.match(/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/),y=m&&+m[1];
    if(!m){m=l.match(/令和\s*(\d{1,2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})/);y=m&&(+m[1]+2018)}
    if(!m){m=l.match(/\b(\d{2})[\/.](\d{1,2})[\/.](\d{1,2})\b/);y=m&&(2000+(+m[1]))}
    if(m){const mo=+m[2],d=+m[3];if(mo>=1&&mo<=12&&d>=1&&d<=31&&y>=2000&&y<=2100)return y+"-"+pad(mo)+"-"+pad(d)}
  }
  return null;
}
function findTime(lines){
  for(const l of lines){if(/TEL|電話/.test(l))continue;
    const m=l.match(/(?:^|[^\d])([01]?\d|2[0-3])\s*[:：時]\s*([0-5]\d)(?!\d)/);if(m)return pad(+m[1])+":"+m[2]}
  return null;
}
function findReceiptNo(lines){
  for(const l of lines){const m=l.match(/(?:レシート|取引|伝票|No|NO|№)\s*(?:No\.?|番号|#)?\.?\s*[:：]?\s*(\d{3,})/);
    if(m&&!/TEL|電話|登録番号/.test(l))return m[1]}
  return null;
}
const TOTAL_KEYS=["合計","お買上","お買い上げ","ご請求","お支払","総額"];
const NOT_TOTAL=["小計","点数","対象","内税","外税","消費税","税率","預","釣","ポイント","%"];
function findTotal(lines){
  const cands=[];
  lines.forEach((l,i)=>{if(!TOTAL_KEYS.some(k=>l.includes(k))||NOT_TOTAL.some(k=>l.includes(k)))return;
    let ns=amounts(l);if(!ns.length&&lines[i+1])ns=amounts(lines[i+1]);
    const v=ns[ns.length-1];if(v>0&&v<1e7)cands.push({g:l.includes("合計"),v})});
  const c=cands.find(x=>x.g)||cands[0];if(c)return{value:c.v,strong:true};
  const ys=lines.filter(l=>l.includes("¥")&&!NOT_TOTAL.some(k=>l.includes(k))).map(l=>{const a=amounts(l);return a[a.length-1]}).filter(v=>v>0&&v<1e7);
  return ys.length?{value:Math.max(...ys),strong:false}:null;
}
const NOT_ITEM=["小計","合計","TEL","電話","登録番号","レジ","責","No.","点数","預","釣","対象","税"];
function findItems(lines,start){
  const out=[];
  for(let i=start+1;i<lines.length;i++){const l=lines[i];
    if(l.includes("小計")||l.includes("合計"))break;
    if(NOT_ITEM.some(k=>l.includes(k))||findDate([l]))continue;
    const m=l.match(/^(.*?[^\d\s¥,.:\/\-].*?)\s*¥?\s*(-?\d{1,3}(?:,\d{3})+|-?\d+)\s*[軽外内※*★]?$/);if(!m)continue;
    let name=m[1].replace(/^[\d\s*.\-]+/,"").trim(),price=parseInt(m[2].replace(/,/g,""),10);
    if(!name||!price||Math.abs(price)>=1e6)continue;
    if(/値引|割引/.test(name)&&price>0)price=-price;
    out.push({name,price});if(out.length>=30)break}
  return out;
}

/* ================= 二重登録チェック ================= */
const keyName=s=>String(s||"").replace(/[\s¥\d,.\-*※]/g,"");
function itemOverlap(a,b){if(!a||!b||!a.length||!b.length)return 0;
  const A=new Set(a.map(i=>keyName(i.name)).filter(Boolean));return b.filter(i=>A.has(keyName(i.name))).length/Math.min(a.length,b.length)}
function sameStore(a,b){a=keyName(a);b=keyName(b);if(!a||!b)return false;return a===b||a.slice(0,3)===b.slice(0,3)}
function findDuplicate(e){
  return entries.find(x=>{
    if(x.id===e.id||x.date!==e.date||x.type==="income")return false;
    if(e.receiptNo&&x.receiptNo&&e.receiptNo===x.receiptNo)return true;
    const ov=itemOverlap(x.items,e.items),xs=x.store||x.memo;
    if(e.time&&x.time){if(e.time!==x.time)return false;return x.amount===e.amount||ov>=0.5||sameStore(xs,e.store)}
    if(x.amount===e.amount&&e.amount>0)return ov>=0.5||sameStore(xs,e.store)||(!e.items.length&&!e.store);
    return false;
  });
}

/* ================= AI読み取り（Google Gemini・任意） =================
   APIキーはこのiPhoneの中（localStorage）だけに保存。GitHubには載りません。 */
const AI={
  get key(){try{return localStorage.getItem("gemini_key")||""}catch(e){return ""}},
  set key(v){try{v?localStorage.setItem("gemini_key",v):localStorage.removeItem("gemini_key")}catch(e){}},
  models:["gemini-3.8-flash","gemini-flash-latest","gemini-3.5-flash-lite","gemini-flash-lite-latest"],
  good:null,pausedUntil:0,
  get on(){return !!this.key&&Date.now()>this.pausedUntil}
};
const AI_PROMPT=`画像に写っている日本のレシート（領収証）を読み取ってください。
複数のレシートが写っている場合は、1枚ずつ別々に receipts に入れてください。レシートが写っていなければ receipts は空にしてください。
各レシートについて：
- store: 店名（チェーン名＋店舗名。例「バロー ルビットタウン刈谷店」）
- date: 購入日 YYYY-MM-DD ／ time: 購入時刻 HH:MM（なければ空文字）
- receipt_no: レシート番号・取引番号（なければ空文字）
- total: 実際に支払った税込の合計金額。お預り・お釣り・小計・税額ではない
- items: 商品ごとの {name, price, category}。price はレシートに書かれた金額のまま。値引きはマイナスで、値引き対象の商品と同じ category にする
- 品目の category の決め方：食品・飲料・調味料・お菓子は「食費」、洗剤・ティッシュ・トイレ用品・シャンプー・ゴミ袋・電池などの生活用品は「日用品」、薬・湿布は「医療費」、衣類は「衣服・靴・バッグ」、ガソリン・カー用品は「車」、飲食店での食事は「外食費」。レジ袋はそのレシートで金額が一番多い分類にする
- category: そのレシート全体で金額が一番多い分類
文字が読みにくい部分は、レシートの文脈から最も可能性の高いものを選んでください。`;
const CAT_ENUM=EXP_CATS.map(c=>c[0]);
const AI_SCHEMA={type:"OBJECT",properties:{receipts:{type:"ARRAY",items:{type:"OBJECT",properties:{
  store:{type:"STRING"},date:{type:"STRING"},time:{type:"STRING"},receipt_no:{type:"STRING"},total:{type:"INTEGER"},
  category:{type:"STRING",enum:CAT_ENUM},
  items:{type:"ARRAY",items:{type:"OBJECT",properties:{name:{type:"STRING"},price:{type:"INTEGER"},category:{type:"STRING",enum:CAT_ENUM}},required:["name","price","category"]}}},
  required:["store","date","time","total","category","items"]}}},required:["receipts"]};
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function geminiCall(model,parts,json,temp){
  const body={contents:[{parts}],generationConfig:{temperature:temp||0}};
  if(json){body.generationConfig.responseMimeType="application/json";body.generationConfig.responseSchema=json===true?AI_SCHEMA:json}
  let res;
  try{res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
    {method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":AI.key},body:JSON.stringify(body)})}
  catch(e){return{err:"net"}}
  if(res.ok){const j=await res.json();return{text:(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||"").join("")}}
  const t=await res.text().catch(()=>"");
  if(/API[_ ]?key|API_KEY_INVALID|PERMISSION_DENIED|unregistered callers/i.test(t))return{err:"key"};
  return{err:res.status===429?"quota":res.status===404?"model":"fail"};
}
async function aiRun(parts,json,temp){
  const order=AI.good?[AI.good,...AI.models.filter(m=>m!==AI.good)]:AI.models;
  let last="fail";
  for(const m of order){
    const r=await geminiCall(m,parts,json,temp);
    if(!r.err){AI.good=m;return r.text}
    if(r.err==="key"||r.err==="net")throw{code:r.err};
    last=r.err==="quota"&&last!=="fail"?last:r.err;
  }
  throw{code:last};
}
/* 1枚の画像から、写っているレシートをすべて読み取る */
async function aiReadReceipts(blob){
  const txt=await aiRun([{inline_data:{mime_type:"image/jpeg",data:await blobToB64(blob)}},{text:AI_PROMPT}],true);
  const j=JSON.parse(txt);
  const list=Array.isArray(j.receipts)?j.receipts:Array.isArray(j)?j:j&&j.total?[j]:[];
  return list.filter(r=>r&&Math.round(+r.total||0)>0);
}
function aiEntry(r){
  const items=(Array.isArray(r.items)?r.items:[]).slice(0,60).map(i=>({name:String(i.name||"").trim(),price:Math.round(+i.price||0),category:i.category})).filter(i=>i.name&&i.price);
  const store=String(r.store||"").trim();
  const p={store,date:/^20\d{2}-\d{2}-\d{2}$/.test(r.date)?r.date:today(),time:/^\d{1,2}:\d{2}$/.test(r.time||"")?r.time.padStart(5,"0"):"",
    receiptNo:String(r.receipt_no||"").replace(/\D/g,""),total:Math.round(+r.total||0),
    category:EXP_CATS.some(c=>c[0]===r.category)?r.category:guessCategory(store,""),items,raw:""};
  return makeEntry(p);
}
function aiErrMsg(code){
  return code==="key"?"APIキーが正しくありません。設定 →「AI読み取り」で確認してください"
    :code==="quota"?"AIの無料枠の上限に達しました。しばらくは端末内の読み取りを使います"
    :code==="net"?"インターネットにつながっていません"
    :"AIで読み取れませんでした。もう一度かざしてください";
}
/* 画像をAI用のJPEGに（最大2000px・メモリ上だけ） */
function toJpeg(src,crop){
  const s=Math.min(1,2000/Math.max(crop.w,crop.h));
  const c=document.createElement("canvas");c.width=Math.round(crop.w*s);c.height=Math.round(crop.h*s);
  c.getContext("2d").drawImage(src,crop.x,crop.y,crop.w,crop.h,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>{c.width=c.height=0;r(b)},"image/jpeg",0.85));
}
/* 同じレシートを何度もAIに送らないための文字の似かた */
function textSim(a,b){
  if(!a||!b)return 0;
  const g=s=>{const set=new Set();s=s.replace(/\s/g,"");for(let i=0;i<s.length-1;i++)set.add(s.slice(i,i+2));return set};
  const A=g(a),B=g(b);let n=0;A.forEach(x=>{if(B.has(x))n++});return n/Math.max(1,Math.min(A.size,B.size));
}

let holdUntil=0,lastSent="",lastSentAt=0,aiBusy=false;

/* 読み取ったレシート（1枚でも複数でも）を登録して、結果を表示 */
async function registerScanned(list){
  const added=[],dups=[];
  for(const e of list){const dup=findDuplicate(e)||added.find(a=>a!==e&&a.date===e.date&&a.amount===e.amount&&sameStore(a.store,e.store));
    if(dup){dups.push(dup);continue}
    await addEntry(e);sessionAdded.push(e);added.push(e)}
  updateCount();
  if(!added.length){const d=dups[0];scanMsg(`登録済みのレシートです（${d.store||d.category} ${yenJ(d.amount)}）`,"dup");return}
  const one=added[0],cats=Object.keys(splitOf(one));
  const text=added.length===1
    ?`✓ 登録しました　${one.store||one.category}　${yenJ(one.amount)}${cats.length>1?`（${cats.join("・")}に分けました）`:`（${cats[0]}）`}`
    :`✓ ${added.length}枚 登録しました　計${yenJ(added.reduce((a,e)=>a+e.amount,0))}${dups.length?`（${dups.length}枚は登録済み）`:""}`;
  scanMsg(text,"ok",added.map(e=>e.id));
}
/* AIで読み取る（自動・シャッター共通） */
async function aiCapture(raw){
  if(aiBusy||!video.videoWidth)return;
  aiBusy=true;document.getElementById("shutter").disabled=true;
  scanMsg("AIで読み取り中…");
  lastSent=raw||lastSent;lastSentAt=Date.now();
  try{
    const list=await aiReadReceipts(await toJpeg(video,cropOf()));
    if(!scanning)return;
    if(!list.length)scanMsg("レシートを読み取れませんでした。全体が枠に入るようにかざしてください","err");
    else await registerScanned(list.map(aiEntry));
  }catch(e){
    scanMsg(aiErrMsg(e&&e.code),"err");
    if(e&&e.code==="quota")AI.pausedUntil=Date.now()+60000;

    aiBusy=false;document.getElementById("shutter").disabled=false;holdUntil=Date.now()+3000;
  }
}

let forceOnce=false;
async function scanLoop(){
  scanMsg("レシートを枠の中にかざしてください");
  while(scanning){
    if(aiBusy||!video.videoWidth){await sleep(200);continue}
    const canvas=ocrCanvas(video,cropOf());
    progressCb=()=>{};
    let data;try{({data}=await (await getWorker()).recognize(canvas))}catch(e){await sleep(500);continue}
    canvas.width=canvas.height=0;
    if(!scanning)break;
    if(aiBusy)continue;
    const p=parseReceipt(data.text||"");
    const looksReceipt=p.raw.length>40&&/合計|小計|領収|お買上|点数|¥\s*\d/.test(p.raw);
    if(p.raw.length<15)lastSent="";            // 何も写っていない＝次のレシートを待つ
    if(AI.on){
      /* 端末内の読み取りは「レシートが写ったか」の判定だけに使い、内容はAIで読む */
      if(looksReceipt&&!(lastSent&&textSim(p.raw,lastSent)>0.7&&Date.now()-lastSentAt<20000)){await aiCapture(p.raw);continue}
      if(Date.now()>holdUntil)scanMsg(looksReceipt?"登録済みです。次のレシートをかざしてください":"レシートを枠の中にかざしてください");
    }else{
      const maxItem=Math.max(0,...p.items.map(i=>i.price));
      const ok=p.strongTotal&&p.total>0&&p.total>=maxItem&&(p.dateFound||p.store||p.time);
      if(ok||(forceOnce&&p.total>0)){await registerScanned([makeEntry(p)]);holdUntil=Date.now()+2500}
      else if(forceOnce)scanMsg("読み取れませんでした。少し近づけて、まっすぐ写してください","err"),holdUntil=Date.now()+2500;
      else if(Date.now()>holdUntil)scanMsg(p.raw.length>30?"合計が読み取れません。少し近づけて、まっすぐ写してください":"レシートを枠の中にかざしてください");
      forceOnce=false;
    }
    await sleep(200);

}

        const blob=await toJpeg(src,{x:0,y:0,w:src.width,h:src.height});if(bmp&&bmp.close)bmp.close();
        let rs;try{rs=await aiReadReceipts(blob)}catch(e){if(e&&e.code==="quota")AI.pausedUntil=Date.now()+60000;if(e&&(e.code==="key"||e.code==="net")){toast(aiErrMsg(e.code));fails++;continue}rs=null}
        if(rs&&rs.length){for(const r of rs){const e=aiEntry(r);if(findDuplicate(e)){dups++;continue}await addEntry(e);added++;last=e;addedList.push(e)}continue}
        if(rs){fails++;continue}
      }
      if(typeof Tesseract==="undefined"){fails++;continue}
      const canvas=ocrCanvas(src,{x:0,y:0,w:src.width,h:src.height});if(bmp&&bmp.close)bmp.close();
      progressCb=m=>{if(m.status==="recognizing text")show("文字を読み取り中…",0.2+m.progress*0.8);
        else if(/loading|initializing/.test(m.status))show("読み取り機能を準備中…",0.1)};
      const {data}=await (await getWorker()).recognize(canvas);canvas.width=canvas.height=0;
      const p=parseReceipt(data.text||"");if(!p.total){fails++;continue}
      const e=makeEntry(p);if(findDuplicate(e)){dups++;continue}
      await addEntry(e);added++;last=e;addedList.push(e);
    }catch(err){console.error(err);fails++}
  }
  busy.hidden=true;
  const msg=[added&&`${added}件 登録`,dups&&`${dups}件は登録済み`,fails&&`${fails}件 読み取れず`].filter(Boolean).join("・");
  toast(msg||"読み取れませんでした");
  if(last){S.month=firstOfMonth(new Date(last.date+"T00:00"));S.tab="cal";render();showReview(addedList)}else render();
};

/* ================= 起動 ================= */
(async()=>{
  try{await DB.open();entries=(await DB.all()||[]).map(migrate);DB.clearImages().catch(()=>{});
    for(const e of entries)DB.put(e).catch(()=>{});
  }catch(e){toast("データを保存できません。プライベートブラウズをオフにしてください")}
  render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator){
    const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadController&&!reloaded){reloaded=true;location.reload()}});
    navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  }
  autoSnapshot();
  setTimeout(weeklyBackupCheck,1500);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){setTimeout(weeklyBackupCheck,800);
    navigator.serviceWorker?.getRegistration().then(r=>r&&r.update()).catch(()=>{})}});
  const standalone=navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(!standalone&&/iPhone|iPad/.test(navigator.userAgent))setTimeout(()=>toast("Safariの共有ボタン →「ホーム画面に追加」でアプリになります"),800);
})();
</script>
