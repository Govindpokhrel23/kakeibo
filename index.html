<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>家計簿</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#A487B4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* 見た目：紫のヘッダー＋薄いグレーの背景＋白い行＋浮いたタブバー（ライトのみ） */
:root{
  --purple:#A487B4; --purple-d:#8E6FA0; --purple-soft:#E9E1EF;
  --bg:#F1F0F0; --row:#FBFAFA; --line:#E2E0E0; --ink:#333; --sub:#9A9A9A;
  --red:#D2453B; --blue:#3E7BD6; --sun:#D8483E; --sat:#5B6FD8;
  --f:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font-family:var(--f);color:inherit;cursor:pointer}
input,select{font-family:var(--f)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* ヘッダー */
.hdr{position:sticky;top:0;z-index:5;background:var(--purple);color:#fff;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:calc(env(safe-area-inset-top,0px) + 64px);display:flex;align-items:center;justify-content:center}
.hdr h1{margin:0;font-size:20px;font-weight:500;letter-spacing:.06em}
.seg{display:flex;background:#fff;border-radius:999px;padding:5px;gap:4px;width:min(100%,330px)}
.seg.wide{width:100%;max-width:440px}
.seg button{flex:1;border:none;background:none;border-radius:999px;padding:9px 4px;font-size:16px;color:#A0A0A0;white-space:nowrap}
.seg button.on{background:#ECEAEE;color:var(--purple-d);font-weight:700}
.monthnav{display:flex;align-items:center;justify-content:center;gap:22px;font-size:24px;width:100%;position:relative}
.monthnav button{background:none;border:none;color:inherit;font-size:22px;padding:4px 8px}
.monthnav .title{font-weight:300;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.searchbtn{position:absolute;right:0;width:48px;height:48px;border-radius:50%;border:none;background:var(--purple-soft);color:#333;display:flex;align-items:center;justify-content:center}
.searchbtn svg{width:24px;height:24px}

main{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 行グループ */
.group{background:var(--row);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:24px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));position:relative;background:none;border:none;width:100%;text-align:left;font-size:17px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1px solid var(--line)}
.row .val{color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.row input{border:none;background:none;font-size:17px;color:var(--ink);text-align:right;min-width:0;flex:1;padding:16px 0}
.row input::placeholder{color:#BDBDBD}
.row input.left{text-align:left}
.chev{color:#BDBDBD;font-size:20px;line-height:1;margin-left:6px}
.datewrap{position:relative;color:var(--sub);font-size:17px}
.datewrap input{position:absolute;inset:0;opacity:0;width:100%;padding:0}
.save{display:block;margin:36px auto 0;width:min(76%,340px);background:var(--purple);color:#fff;border:none;border-radius:999px;padding:16px;font-size:18px;font-weight:600;box-shadow:0 4px 10px rgba(120,90,140,.25)}

/* スキャンカード */
.scancard{margin:20px auto 0;width:calc(100% - 32px);max-width:520px;display:flex;align-items:center;gap:16px;background:#fff;border:none;border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:left}
.scancard .ic{width:56px;height:56px;border-radius:16px;background:var(--purple);display:flex;align-items:center;justify-content:center;flex:none}
.scancard .ic svg{width:30px;height:30px;color:#fff}
.scancard b{display:block;font-size:18px}
.scancard span{font-size:13px;color:var(--sub)}
.subacts{display:flex;justify-content:center;gap:20px;margin-top:10px}
.subacts button{background:none;border:none;color:var(--purple-d);font-size:14px;padding:6px}
.seclabel{font-size:13px;color:var(--sub);margin:22px 0 -16px;padding-left:max(16px,env(safe-area-inset-left,0px))}

/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:#fff}
.cal .wk{text-align:center;font-size:14px;padding:4px 0;background:#F6F5F5;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cal .wk:nth-child(7n){border-right:none}
.cal .wk.sun,.cal .d.sun .n{color:var(--sun)}
.cal .wk.sat,.cal .d.sat .n{color:var(--sat)}
.cal .d{height:80px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 4px 6px;display:flex;flex-direction:column;justify-content:space-between;background:#fff;border-top:none;border-left:none;text-align:left;min-width:0}
.cal .d:nth-child(7n){border-right:none}
.cal .d.out{background:#F4F3F3}
.cal .d.out .n{color:#C4C4C4!important}
.cal .n{font-size:14px;align-self:flex-start;padding:0 3px;border-radius:3px;font-variant-numeric:tabular-nums}
.cal .d.today .n{background:var(--purple);color:#fff!important}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--purple)}
.cal .amt{font-size:12px;text-align:right;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:clip}
.cal .amt.in{color:var(--blue)}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--row);border-bottom:1px solid var(--line);padding:10px 0 12px}
.sum3 div{text-align:center}
.sum3 small{display:block;font-size:14px;color:var(--sub)}
.sum3 b{font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.dayhead{background:#ECEBEB;color:#555;font-size:15px;padding:6px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.list{background:var(--row)}
.item{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;text-align:left;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));position:relative;font-size:18px}
.item+.item::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1px solid var(--line)}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--sub);font-size:16px}
.item .a{font-variant-numeric:tabular-nums;white-space:nowrap}
.item .a.in{color:var(--blue)}
.item .scanmark{width:16px;height:16px;color:var(--purple);flex:none}
.empty{color:var(--sub);text-align:center;padding:36px 16px;font-size:15px;line-height:1.7}

/* グラフ */
.gnav{display:flex;align-items:center;justify-content:center;gap:26px;font-size:24px;padding:16px 0 10px;border-bottom:1px solid var(--line);margin:0 16px}
.gnav button{background:none;border:none;font-size:22px;color:#444;padding:4px 8px}
.gnav span{font-weight:300;font-variant-numeric:tabular-nums}
.donut{display:flex;justify-content:center;padding:16px 0 18px;border-bottom:1px solid var(--line)}
.donut svg{width:min(78vw,320px);height:auto}
.donut text{font-family:var(--f);fill:#fff;font-size:15px;paint-order:stroke;stroke:rgba(0,0,0,.12);stroke-width:2px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}

/* 設定 */
.setgroup{background:var(--row);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.setlabel{font-size:14px;color:var(--sub);padding:14px max(16px,env(safe-area-inset-left,0px)) 8px;background:#ECEBEB}
.row.danger{color:var(--red)}

/* タブバー */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;width:min(calc(100% - 32px),520px);background:rgba(255,255,255,.96);border-radius:40px;box-shadow:0 4px 18px rgba(0,0,0,.14);display:flex;padding:6px}
.tabbar button{flex:1;border:none;background:none;border-radius:32px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#444}
.tabbar svg{width:30px;height:30px;color:#555}
.tabbar button.on{background:#EDEBEE;color:var(--purple-d)}
.tabbar button.on svg{color:var(--purple)}

/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--purple);color:#fff;position:sticky;top:0;z-index:1}
.sheet .sh button{background:none;border:none;color:#fff;font-size:16px;padding:4px}
.sheet .sh b{font-weight:500;font-size:17px}
.sheet .group{margin-top:16px}
.sheet select{border:none;background:none;font-size:17px;color:var(--sub);text-align:right;direction:rtl;max-width:60%}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.catgrid button{background:#fff;border:2px solid transparent;border-radius:12px;padding:14px 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.catgrid button.on{border-color:var(--purple)}
.miniitems{padding:6px 16px 0;font-size:14px;color:#666}
.miniitems div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.btnrow{display:flex;gap:10px;padding:20px 16px 0}
.btnrow button{flex:1;border-radius:999px;padding:14px;font-size:16px;border:none}
.btn-p{background:var(--purple);color:#fff;font-weight:600}
.btn-d{background:#fff;color:var(--red);border:1px solid #E7C7C4!important}
.btn-g{background:#fff;color:#555;border:1px solid var(--line)!important}
details{padding:10px 16px;font-size:12px;color:var(--sub)}
details pre{white-space:pre-wrap;font-size:11px;background:#fff;padding:8px;border-radius:6px;max-height:180px;overflow:auto}
.note{font-size:13px;color:#666;line-height:1.7;padding:16px}

/* トースト */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;background:rgba(50,40,60,.92);color:#fff;border-radius:999px;padding:10px 18px;font-size:15px;max-width:calc(100% - 32px);text-align:center}

/* スキャナー */
.scanner{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scan-top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;gap:12px}
.scan-top button{background:var(--purple);color:#fff;border:none;border-radius:999px;padding:9px 20px;font-size:16px;font-weight:600}
.scan-count{font-size:15px}
.scan-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.vbox{position:relative;width:0;height:0}
.vbox video{display:block;width:100%;height:100%;object-fit:fill;background:#111}
.guide{position:absolute;left:8%;right:8%;top:4%;bottom:4%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);transition:border-color .2s}
.guide.ok{border-color:#7EE0B8}.guide.dup{border-color:#F2C14E}
.scan-msg{margin:12px 16px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.14);font-size:15px;line-height:1.5;min-height:54px;display:flex;align-items:center;gap:10px}
.scan-msg.ok{background:#2E8A64}.scan-msg.dup{background:#7A6115}.scan-msg.err{background:#8A2E2E}
.scan-msg .msgtext{flex:1}
.scan-msg .undo{background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;flex:none}
.scan-bottom{display:flex;align-items:center;gap:14px;padding:0 16px 12px}
.scan-bottom span{font-size:12px;color:#BBB;line-height:1.5}
#shutter{width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:var(--purple);flex:none}
#shutter:active{transform:scale(.94)}
#shutter:disabled{opacity:.4}
.keybox{margin:0 16px;background:#fff;border-radius:10px;padding:12px;font-size:14px;line-height:1.7;user-select:all;-webkit-user-select:all;word-break:break-all}
.aion{display:inline-block;font-size:11px;background:var(--purple-soft);color:var(--purple-d);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.pulse{width:10px;height:10px;border-radius:50%;background:#C9A6DE;flex:none;animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.busy{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.busy div{background:#fff;border-radius:16px;padding:22px 26px;font-size:15px;min-width:220px;text-align:center}
.busy .bar{height:6px;background:var(--purple-soft);border-radius:3px;margin-top:12px;overflow:hidden}
.busy .bar i{display:block;height:100%;background:var(--purple);width:0;transition:width .2s}
</style>
</head>
<body>
<header class="hdr" id="hdr"></header>
<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="input"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zm17.7-10.2a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>入力</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M7.5 11h9M7.5 14.5h9M7.5 18h6" stroke-linecap="round"/></svg>カレンダー</button>
  <button data-tab="graph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 3.05A9 9 0 1 0 20.95 13H11V3.05z"/><path d="M13 2.05V11h8.95A9 9 0 0 0 13 2.05z" opacity=".55"/></svg>グラフ</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>設定</button>
</nav>

<div class="scanner" id="scanner" hidden>
  <div class="scan-top">
    <span class="scan-count" id="scanCount">登録 0件</span>
    <button id="closeScan">完了</button>
  </div>
  <div class="scan-stage" id="stage">
    <div class="vbox" id="vbox">
      <video id="video" playsinline muted autoplay></video>
      <div class="guide" id="guide"></div>
    </div>
  </div>
  <div class="scan-msg" id="scanMsg"><span class="pulse"></span><span id="scanText">カメラを起動中…</span></div>
  <div class="scan-bottom"><button id="shutter" aria-label="今すぐ読み取る"></button><span>自動で読み取ります。うまくいかない時はボタンで撮影</span></div>
</div>

<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="rsFile" accept=".json,application/json" hidden>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="busy" id="busy" hidden><div><span id="busyText">読み取り中…</span><div class="bar"><i id="busyBar"></i></div></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
/* ================= 基本 ================= */
const EXP_CATS=[
  ["食費","#8CC394"],["外食費","#F2B659"],["日用品","#4DA6DA"],["交通費","#E2678F"],["衣服・靴・バッグ","#3E3B55"],
  ["趣味","#D65A55"],["交際費","#C7D9A6"],["医療費","#7CC5B6"],["車","#4E9C78"],["通信費","#7884C6"],
  ["光熱費","#EFA27A"],["家に納める用","#BDB6B2"],["その他","#E8E1EF"]];
const INC_CATS=[["給料","#4DA6DA"],["副業","#8CC394"],["ボーナス","#F2B659"],["その他収入","#BDB6B2"]];
const catColor=(c,type)=>((type==="income"?INC_CATS:EXP_CATS).find(x=>x[0]===c)||[0,"#CCC"])[1];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yenJ=n=>Math.round(n||0).toLocaleString("ja-JP")+"円";
const WD="日月火水木金土";
const dayLabel=s=>{const d=new Date(s+"T00:00");return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`};
const md=s=>{const d=new Date(s+"T00:00");return `${d.getMonth()+1}/${d.getDate()}`};
const monthKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const SCAN_ICON=`<svg class="scanmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 12h8"/></svg>`;

/* ================= 保存（IndexedDB・このiPhoneの中だけ） ================= */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("kakeibo",1);
    r.onupgradeneeded=()=>{r.result.createObjectStore("receipts",{keyPath:"id"});r.result.createObjectStore("images")};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx("receipts","readonly",s=>s.getAll())},
  put(e){return this.tx("receipts","readwrite",s=>s.put(e))},
  del(id){return this.tx("receipts","readwrite",s=>s.delete(id))},
  clear(){return this.tx("receipts","readwrite",s=>s.clear())},
  clearImages(){return this.tx("images","readwrite",s=>s.clear())}
};
/* 旧版のデータを新しい形に */
const OLD_CAT={"外食":"外食費","交通":"交通費","衣服":"衣服・靴・バッグ","娯楽":"趣味","医療":"医療費"};
function migrate(e){
  const {hasImage,...x}=e;
  if(x.amount==null){x.amount=+x.total||0;delete x.total}
  if(!x.type)x.type="expense";
  if(OLD_CAT[x.category])x.category=OLD_CAT[x.category];
  if(x.memo==null)x.memo=x.store||"";
  return x;
}

let entries=[];
const S={tab:"input",month:firstOfMonth(new Date()),inputType:"expense",graphMode:"expense",selDay:null,
  form:{amount:"",category:"食費",memo:"",date:today()}};
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1)}

async function addEntry(e){await DB.put(e);entries.push(e)}
async function updateEntry(e){await DB.put(e);entries=entries.map(x=>x.id===e.id?e:x)}
async function removeEntry(id){await DB.del(id);entries=entries.filter(x=>x.id!==id)}

let toastT;
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

const hdr=document.getElementById("hdr"),view=document.getElementById("view");
document.querySelectorAll("#tabbar button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.selDay=null;render();scrollTo(0,0)});
function render(){
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));

function segHTML(opts,cur,attr,wide){return `<div class="seg${wide?" wide":""}">${opts.map(([v,l])=>`<button data-${attr}="${v}" class="${v===cur?"on":""}">${l}</button>`).join("")}</div>`}
function monthNavHTML(){return `<div class="monthnav"><button data-mv="-1" aria-label="前の月">◁</button><span class="title">${S.month.getFullYear()}年${S.month.getMonth()+1}月</span><button data-mv="1" aria-label="次の月">▷</button>`}
function bindMonthNav(root){root.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()+(+b.dataset.mv),1);S.selDay=null;render()})}

function renderCal(){
  hdr.innerHTML=monthNavHTML()+`<button class="searchbtn" id="srch" aria-label="検索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button></div>`;
  bindMonthNav(hdr);hdr.querySelector("#srch").onclick=openSearch;
  const y=S.month.getFullYear(),m=S.month.getMonth(),mk=monthKey(S.month);
  const list=entries.filter(e=>e.date.startsWith(mk));
  const byDay={};list.forEach(e=>{const o=byDay[e.date]=byDay[e.date]||{ex:0,in:0};o[e.type==="income"?"in":"ex"]+=e.amount});
  const start=new Date(y,m,1-new Date(y,m,1).getDay());
  const lastDay=new Date(y,m+1,0);const cells=Math.ceil((new Date(y,m,1).getDay()+lastDay.getDate())/7)*7;
  let grid=[..."日月火水木金土"].map((w,i)=>`<div class="wk ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("");
  for(let i=0;i<cells;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const k=ymd(d);const o=byDay[k];
    const cls=["d",d.getMonth()!==m?"out":"",d.getDay()===0?"sun":d.getDay()===6?"sat":"",k===today()?"today":"",k===S.selDay?"sel":""].join(" ");
    grid+=`<button class="${cls}" data-day="${k}"><span class="n">${d.getDate()}</span><span>${o&&o.in?`<div class="amt in">${yenJ(o.in)}</div>`:""}${o&&o.ex?`<div class="amt">${yenJ(o.ex)}</div>`:""}</span></button>`;
  }
  const inc=list.filter(e=>e.type==="income").reduce((a,e)=>a+e.amount,0),exp=list.filter(e=>e.type!=="income").reduce((a,e)=>a+e.amount,0);
  view.innerHTML=`<div class="cal">${grid}</div>
    <div class="sum3"><div><small>収入</small><b>${yenJ(inc)}</b></div><div><small>支出</small><b>${yenJ(exp)}</b></div><div><small>合計</small><b>${(inc-exp<0?"-":"")+yenJ(Math.abs(inc-exp))}</b></div></div>
    ${listByDay(list)}`;
  view.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.day;const d=new Date(k+"T00:00");
    if(d.getMonth()!==m){S.month=firstOfMonth(d);S.selDay=k;render();return}
    S.selDay=k;render();
    const h=view.querySelector(`[data-dh="${k}"]`);
    if(h)h.scrollIntoView({behavior:"smooth",block:"start"});
    else{S.form.date=k;toast(`${md(k)} の記録はありません`)}
  });
  bindItems(view);
}
function listByDay(list){
  if(!list.length)return `<div class="empty">この月の記録はありません。<br>「入力」からレシートをスキャンすると自動で追加されます。</div>`;
  const days={};list.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  return Object.keys(days).sort().reverse().map(d=>`<div class="dayhead" data-dh="${d}" style="scroll-margin-top:calc(env(safe-area-inset-top,0px) + 80px)">${dayLabel(d)}</div><div class="list">${
    days[d].sort((a,b)=>(b.time||"").localeCompare(a.time||"")||(b.created||0)-(a.created||0)).map(itemHTML).join("")}</div>`).join("");
}
function itemHTML(e){
  return `<button class="item" data-id="${esc(e.id)}"><span class="t">${esc(e.category)}${e.memo?`<small>(${esc(e.memo)})</small>`:""}</span>${e.source==="scan"?SCAN_ICON:""}<span class="a${e.type==="income"?" in":""}">${yenJ(e.amount)}</span></button>`;
}
function bindItems(root){root.querySelectorAll(".item[data-id]").forEach(b=>b.onclick=()=>openEdit(entries.find(x=>x.id===b.dataset.id)))}

function renderGraph(){
  hdr.innerHTML=segHTML([["expense","支出"],["income","収入"],["yexp","年間支出"],["yinc","年間収入"]],S.graphMode,"gm",true);
  hdr.querySelectorAll("[data-gm]").forEach(b=>b.onclick=()=>{S.graphMode=b.dataset.gm;render()});
  const yearly=S.graphMode.startsWith("y");const type=/inc/.test(S.graphMode)?"income":"expense";

  const cats=(type==="income"?INC_CATS:EXP_CATS).map(([c,col])=>({c,col,v:list.filter(e=>e.category===c).reduce((a,e)=>a+e.amount,0)}));

  cats.sort((a,b)=>b.v-a.v);

    <div class="donut">${donutSVG(cats.filter(x=>x.v>0),total)}</div>

      <button class="item" data-gc=""><span class="t">合計</span><span class="a">${yenJ(total)}</span><span class="chev">›</span></button>
    </div>
    <div class="list">${cats.map(x=>`<button class="item" data-gc="${esc(x.c)}"><span class="dot" style="background:${x.col}"></span><span class="t">${esc(x.c)}</span><span class="a">${yenJ(x.v)}</span><span class="chev">›</span></button>`).join("")}</div>`;
  view.querySelectorAll("[data-gv]").forEach(b=>b.onclick=()=>{const k=+b.dataset.gv;S.month=yearly?new Date(S.month.getFullYear()+k,S.month.getMonth(),1):new Date(S.month.getFullYear(),S.month.getMonth()+k,1);render()});
  view.querySelectorAll("[data-gc]").forEach(b=>b.onclick=()=>{

  });
}
function donutSVG(parts,total){
  const cx=160,cy=160,R=150,r=62;
  if(!total)return `<svg viewBox="0 0 320 320"><circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="#E6E3E8" stroke-width="${R-r}"/><text x="160" y="166" text-anchor="middle" style="fill:#AAA;stroke:none">記録なし</text></svg>`;
  const p=(rad,a)=>[cx+rad*Math.sin(a),cy-rad*Math.cos(a)];
  let a=0,paths="",labels="";
  for(const x of parts){
    const sweep=x.v/total*Math.PI*2;
    const a1=a+Math.min(sweep,Math.PI*2-0.0001);
    const L=(a1-a)>Math.PI?1:0;const [x0,y0]=p(R,a),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a);
    paths+=`<path d="M${x0},${y0}A${R},${R} 0 ${L} 1 ${x1},${y1}L${x2},${y2}A${r},${r} 0 ${L} 0 ${x3},${y3}Z" fill="${x.col}" stroke="#fff" stroke-width="1"/>`;
    if(x.v/total>=0.07){const [lx,ly]=p((R+r)/2,(a+a1)/2);labels+=`<text x="${lx.toFixed(1)}" y="${(ly+5).toFixed(1)}" text-anchor="middle"${x.col==="#E8E1EF"||x.col==="#C7D9A6"?' style="fill:#555;stroke:none"':""}>${esc(x.c.length>5?x.c.slice(0,5):x.c)}</text>`}
    a+=sweep;
  }
  return `<svg viewBox="0 0 320 320" role="img" aria-label="カテゴリー別の割合">${paths}${labels}</svg>`;
}

function exportCSV(){
  const rows=entries.slice().sort((a,b)=>(a.date+(a.time||""))<(b.date+(b.time||""))?-1:1)
    .map(e=>[e.date,e.time||"",e.type==="income"?"収入":"支出",e.category,'"'+String(e.memo||"").replace(/"/g,'""')+'"',e.amount].join(","));
  shareOrDownload(`kakeibo-${today()}.csv`,"﻿日付,時刻,種類,カテゴリー,メモ,金額\n"+rows.join("\n"),"text/csv");
}
async function shareOrDownload(name,text,type){
  const file=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
document.getElementById("rsFile").onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value="";if(!f)return;
  let arr;try{arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0}catch(e){toast("ファイルの形式が正しくありません");return}
  arr=arr.filter(e=>e&&e.id&&e.date).map(migrate);

function ocrCanvas(src,crop){
  const scale=Math.min(2.5,1800/Math.min(crop.w,crop.h),3000/Math.max(crop.w,crop.h));
  const w=Math.round(crop.w*scale),h=Math.round(crop.h*scale);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(src,crop.x,crop.y,crop.w,crop.h,0,0,w,h);
  const d=g.getImageData(0,0,w,h),p=d.data,hist=new Uint32Array(256);
  for(let i=0;i<p.length;i+=4){const y=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0;p[i]=y;hist[y]++}
  let lo=0,hi=255,acc=0;const n=w*h;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>n*0.02){lo=i;break}}
  acc=0;for(let i=255;i>=0;i--){acc+=hist[i];if(acc>n*0.10){hi=i;break}}
  const r=Math.max(1,hi-lo);
  for(let i=0;i<p.length;i+=4){let v=(p[i]-lo)*255/r;v=v<0?0:v>255?255:v;p[i]=p[i+1]=p[i+2]=v}
  g.putImageData(d,0,0);return c;
}

const JA="぀-ヿ㐀-鿿ｦ-ﾟ";
function normalize(s){
  s=s.replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[￥\\]/g,"¥").replace(/　/g," ");
  s=s.replace(new RegExp("(["+JA+"])\\s+(?=["+JA+"])","g"),"$1");
  s=s.replace(/(\d)\s*,\s*(\d{3})/g,"$1,$2").replace(/(\d)\s+(?=\d{3}\b)/g,"$1");
  s=s.replace(/[Yy](?=\s*\d)/g,"¥");
  s=s.replace(/¥\s*((?:\d[\s,]*){1,8})/g,(_,n)=>"¥"+n.replace(/\s+/g,"").replace(/,$/,"")+" ").trim();
  return s.trim();
}
const amounts=line=>(line.match(/-?\d{1,3}(?:,\d{3})+|-?\d+/g)||[]).map(x=>parseInt(x.replace(/,/g,""),10)).filter(n=>!isNaN(n));

function findStore(lines){
  for(let i=0;i<Math.min(8,lines.length);i++){
    const l=lines[i];if(NOT_STORE.some(k=>l.includes(k)))continue;
    const letters=(l.match(new RegExp("["+JA+"A-Za-z]","g"))||[]).length,digits=(l.match(/\d/g)||[]).length;
    if(letters>=2&&digits*2<l.length)return{i,name:l.replace(/[^\p{L}\p{N}・&ー\-\s]/gu,"").trim()};
  }
  return null;
}
function findDate(lines){
  for(const l of lines){
    let m=l.match(/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/),y=m&&+m[1];
    if(!m){m=l.match(/令和\s*(\d{1,2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})/);y=m&&(+m[1]+2018)}
    if(!m){m=l.match(/\b(\d{2})[\/.](\d{1,2})[\/.](\d{1,2})\b/);y=m&&(2000+(+m[1]))}
    if(m){const mo=+m[2],d=+m[3];if(mo>=1&&mo<=12&&d>=1&&d<=31&&y>=2000&&y<=2100)return y+"-"+pad(mo)+"-"+pad(d)}
  }
  return null;
}
function findTime(lines){
  for(const l of lines){if(/TEL|電話/.test(l))continue;
    const m=l.match(/(?:^|[^\d])([01]?\d|2[0-3])\s*[:：時]\s*([0-5]\d)(?!\d)/);if(m)return pad(+m[1])+":"+m[2]}
  return null;
}
function findReceiptNo(lines){
  for(const l of lines){const m=l.match(/(?:レシート|取引|伝票|No|NO|№)\s*(?:No\.?|番号|#)?\.?\s*[:：]?\s*(\d{3,})/);
    if(m&&!/TEL|電話|登録番号/.test(l))return m[1]}
  return null;
}
const TOTAL_KEYS=["合計","お買上","お買い上げ","ご請求","お支払","総額"];
const NOT_TOTAL=["小計","点数","対象","内税","外税","消費税","税率","預","釣","ポイント","%"];
function findTotal(lines){
  const cands=[];
  lines.forEach((l,i)=>{if(!TOTAL_KEYS.some(k=>l.includes(k))||NOT_TOTAL.some(k=>l.includes(k)))return;
    let ns=amounts(l);if(!ns.length&&lines[i+1])ns=amounts(lines[i+1]);
    const v=ns[ns.length-1];if(v>0&&v<1e7)cands.push({g:l.includes("合計"),v})});
  const c=cands.find(x=>x.g)||cands[0];if(c)return{value:c.v,strong:true};
  const ys=lines.filter(l=>l.includes("¥")&&!NOT_TOTAL.some(k=>l.includes(k))).map(l=>{const a=amounts(l);return a[a.length-1]}).filter(v=>v>0&&v<1e7);
  return ys.length?{value:Math.max(...ys),strong:false}:null;
}
const NOT_ITEM=["小計","合計","TEL","電話","登録番号","レジ","責","No.","点数","預","釣","対象","税"];
function findItems(lines,start){
  const out=[];
  for(let i=start+1;i<lines.length;i++){const l=lines[i];
    if(l.includes("小計")||l.includes("合計"))break;
    if(NOT_ITEM.some(k=>l.includes(k))||findDate([l]))continue;
    const m=l.match(/^(.*?[^\d\s¥,.:\/\-].*?)\s*¥?\s*(-?\d{1,3}(?:,\d{3})+|-?\d+)\s*[軽外内※*★]?$/);if(!m)continue;
    let name=m[1].replace(/^[\d\s*.\-]+/,"").trim(),price=parseInt(m[2].replace(/,/g,""),10);
    if(!name||!price||Math.abs(price)>=1e6)continue;
    if(/値引|割引/.test(name)&&price>0)price=-price;
    out.push({name,price});if(out.length>=30)break}
  return out;
}
const CAT_RULES=[

function parseReceipt(text){
  const lines=text.split(/\n+/).map(normalize).filter(Boolean);
  const st=findStore(lines),items=findItems(lines,st?st.i:-1),t=findTotal(lines),date=findDate(lines),store=st?st.name:"";

function makeEntry(p){

/* ================= 二重登録チェック ================= */
const keyName=s=>String(s||"").replace(/[\s¥\d,.\-*※]/g,"");
function itemOverlap(a,b){if(!a||!b||!a.length||!b.length)return 0;
  const A=new Set(a.map(i=>keyName(i.name)).filter(Boolean));return b.filter(i=>A.has(keyName(i.name))).length/Math.min(a.length,b.length)}
function sameStore(a,b){a=keyName(a);b=keyName(b);if(!a||!b)return false;return a===b||a.slice(0,3)===b.slice(0,3)}
function findDuplicate(e){
  return entries.find(x=>{
    if(x.id===e.id||x.date!==e.date||x.type==="income")return false;
    if(e.receiptNo&&x.receiptNo&&e.receiptNo===x.receiptNo)return true;
    const ov=itemOverlap(x.items,e.items),xs=x.store||x.memo;
    if(e.time&&x.time){if(e.time!==x.time)return false;return x.amount===e.amount||ov>=0.5||sameStore(xs,e.store)}
    if(x.amount===e.amount&&e.amount>0)return ov>=0.5||sameStore(xs,e.store)||(!e.items.length&&!e.store);
    return false;
  });
}

const AI={

文字が読みにくい部分は、レシートの文脈から最も可能性の高いものを選んでください。`;

  is_receipt:{type:"BOOLEAN"},store:{type:"STRING"},date:{type:"STRING"},time:{type:"STRING"},receipt_no:{type:"STRING"},
  total:{type:"INTEGER"},category:{type:"STRING",enum:EXP_CATS.map(c=>c[0])},

async function geminiCall(model,parts,json){
  const body={contents:[{parts}],generationConfig:{temperature:0}};
  if(json){body.generationConfig.responseMimeType="application/json";body.generationConfig.responseSchema=AI_SCHEMA}
  let res;

    {method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":AI.key},body:JSON.stringify(body)})}
  catch(e){return{err:"net"}}

  }
  if(scannerEl.hidden){stopStream();return}
  video.muted=true;video.setAttribute("playsinline","");video.setAttribute("muted","");
  video.srcObject=stream;
  video.play().catch(()=>{});
  const ok=await waitFor(()=>video.videoWidth>0&&video.readyState>=2,6000);
  if(!ok){scanMsg("カメラの映像が届きません。一度「完了」を押して、もう一度お試しください。","err");return}
  fitVideo();
  scanning=true;
  if(typeof Tesseract==="undefined"){scanMsg("レシートを枠に入れて、下のボタンで撮影してください");return}
  if(!workerP)scanMsg("読み取り機能を準備中…（初回のみ少し時間がかかります）");
  try{await getWorker()}catch(e){scanMsg("読み取り機能を読み込めませんでした。ネットにつないでください。","err");return}
  scanLoop();
}
function stopStream(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null}
function closeScanner(){
  scanning=false;scannerEl.hidden=true;stopStream();
  if(sessionAdded.length){const last=sessionAdded[sessionAdded.length-1];S.month=firstOfMonth(new Date(last.date+"T00:00"));S.tab="cal";S.selDay=null;
    toast(`${sessionAdded.length}件 登録しました`)}
  render();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&!scannerEl.hidden)closeScanner()});
function updateCount(){document.getElementById("scanCount").textContent="登録 "+sessionAdded.length+"件"}

let holdUntil=0,lastSent="",lastSentAt=0,aiBusy=false;
const cropOf=()=>{const vw=video.videoWidth,vh=video.videoHeight;return{x:vw*0.08,y:vh*0.04,w:vw*0.84,h:vh*0.92}};
async function registerScanned(e){
  const dup=findDuplicate(e);
  if(dup){scanMsg(`登録済みのレシートです（${dup.memo||dup.category} ${yenJ(dup.amount)}）`,"dup");return}
  await addEntry(e);sessionAdded.push(e);updateCount();
  scanMsg(`✓ 登録しました　${e.category}　${yenJ(e.amount)}`,"ok",e.id);
}
/* AIで読み取る（自動・シャッター共通） */
async function aiCapture(raw){
  if(aiBusy||!video.videoWidth)return;
  aiBusy=true;document.getElementById("shutter").disabled=true;
  scanMsg("AIで読み取り中…");
  lastSent=raw||lastSent;lastSentAt=Date.now();
  try{
    const r=await aiReadReceipt(await toJpeg(video,cropOf()));
    if(!scanning)return;
    if(!r||!r.is_receipt||!(r.total>0))scanMsg("レシートを読み取れませんでした。全体が枠に入るようにかざしてください","err");
    else await registerScanned(aiEntry(r));
  }catch(e){
    scanMsg(aiErrMsg(e&&e.code),"err");
    if(e&&e.code==="quota")AI.pausedUntil=Date.now()+60000;
  }finally{
    aiBusy=false;document.getElementById("shutter").disabled=false;holdUntil=Date.now()+3000;
  }
}
document.getElementById("shutter").onclick=async()=>{
  if(!scanning)return;
  if(AI.on){lastSent="";aiCapture("");return}
  /* AIなし：端末内の読み取りで今のフレームを強制チェック */
  forceOnce=true;scanMsg("読み取り中…");
};
let forceOnce=false;
async function scanLoop(){
  scanMsg("レシートを枠の中にかざしてください");
  while(scanning){
    if(aiBusy||!video.videoWidth){await sleep(200);continue}
    const canvas=ocrCanvas(video,cropOf());
    progressCb=()=>{};
    let data;try{({data}=await (await getWorker()).recognize(canvas))}catch(e){await sleep(500);continue}
    canvas.width=canvas.height=0;
    if(!scanning)break;
    if(aiBusy)continue;
    const p=parseReceipt(data.text||"");
    const looksReceipt=p.raw.length>40&&/合計|小計|領収|お買上|点数|¥\s*\d/.test(p.raw);
    if(p.raw.length<15)lastSent="";            // 何も写っていない＝次のレシートを待つ
    if(AI.on){
      /* 端末内の読み取りは「レシートが写ったか」の判定だけに使い、内容はAIで読む */
      if(looksReceipt&&!(lastSent&&textSim(p.raw,lastSent)>0.7&&Date.now()-lastSentAt<20000)){await aiCapture(p.raw);continue}
      if(Date.now()>holdUntil)scanMsg(looksReceipt?"登録済みです。次のレシートをかざしてください":"レシートを枠の中にかざしてください");
    }else{
      const maxItem=Math.max(0,...p.items.map(i=>i.price));
      const ok=p.strongTotal&&p.total>0&&p.total>=maxItem&&(p.dateFound||p.store||p.time);
      if(ok||(forceOnce&&p.total>0)){await registerScanned(makeEntry(p));holdUntil=Date.now()+2500}
      else if(forceOnce)scanMsg("読み取れませんでした。少し近づけて、まっすぐ写してください","err"),holdUntil=Date.now()+2500;
      else if(Date.now()>holdUntil)scanMsg(p.raw.length>30?"合計が読み取れません。少し近づけて、まっすぐ写してください":"レシートを枠の中にかざしてください");
      forceOnce=false;
    }
    await sleep(200);
  }
}

/* ================= 写真から読み取る（写真は保存しない） ================= */
const busy=document.getElementById("busy"),busyText=document.getElementById("busyText"),busyBar=document.getElementById("busyBar");
document.getElementById("pick").onchange=async ev=>{
  const files=[...(ev.target.files||[])];ev.target.value="";if(!files.length)return;
  if(typeof Tesseract==="undefined"&&!AI.on){toast("読み取り機能を読み込めません。ネットにつないで開き直してください");return}
  busy.hidden=false;let added=0,dups=0,fails=0,last=null;
  for(let k=0;k<files.length;k++){
    const head=files.length>1?`（${k+1}/${files.length}）`:"";
    const show=(t,p)=>{busyText.textContent=t+head;busyBar.style.width=Math.round(p*100)+"%"};
    show("画像を準備中…",0.05);
    try{
      const bmp=await createImageBitmap(files[k],{imageOrientation:"from-image"}).catch(()=>null);
      const src=bmp||await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(files[k])});
      if(AI.on){
        show("AIで読み取り中…",0.5);
        const blob=await toJpeg(src,{x:0,y:0,w:src.width,h:src.height});if(bmp&&bmp.close)bmp.close();
        let r;try{r=await aiReadReceipt(blob)}catch(e){if(e&&e.code==="quota")AI.pausedUntil=Date.now()+60000;if(e&&(e.code==="key"||e.code==="net")){toast(aiErrMsg(e.code));fails++;continue}r=null}
        if(r&&r.is_receipt&&r.total>0){const e=aiEntry(r);if(findDuplicate(e)){dups++;continue}await addEntry(e);added++;last=e;continue}
        if(r){fails++;continue}
      }
      if(typeof Tesseract==="undefined"){fails++;continue}
      const canvas=ocrCanvas(src,{x:0,y:0,w:src.width,h:src.height});if(bmp&&bmp.close)bmp.close();
      progressCb=m=>{if(m.status==="recognizing text")show("文字を読み取り中…",0.2+m.progress*0.8);
        else if(/loading|initializing/.test(m.status))show("読み取り機能を準備中…",0.1)};
      const {data}=await (await getWorker()).recognize(canvas);canvas.width=canvas.height=0;
      const p=parseReceipt(data.text||"");if(!p.total){fails++;continue}
      const e=makeEntry(p);if(findDuplicate(e)){dups++;continue}
      await addEntry(e);added++;last=e;
    }catch(err){console.error(err);fails++}
  }
  busy.hidden=true;
  const msg=[added&&`${added}件 登録`,dups&&`${dups}件は登録済み`,fails&&`${fails}件 読み取れず`].filter(Boolean).join("・");
  toast(msg||"読み取れませんでした");
  if(last){S.month=firstOfMonth(new Date(last.date+"T00:00"));render();openEdit(last)}else render();
};

/* ================= 起動 ================= */
(async()=>{
  try{await DB.open();entries=(await DB.all()||[]).map(migrate);DB.clearImages().catch(()=>{});
    for(const e of entries)DB.put(e).catch(()=>{});
  }catch(e){toast("データを保存できません。プライベートブラウズをオフにしてください")}
  render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  const standalone=navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(!standalone&&/iPhone|iPad/.test(navigator.userAgent))setTimeout(()=>toast("Safariの共有ボタン →「ホーム画面に追加」でアプリになります"),800);
})();
</script>
